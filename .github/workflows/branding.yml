name: Validate Trinyx branding

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trinyx-branding-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  branding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7, Node 24
        with:
          persist-credentials: false
      - name: Enforce canonical external Trinyx identity
        run: bash scripts/validate-trinyx-branding.sh

