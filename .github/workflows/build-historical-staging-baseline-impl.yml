name: Build Historical Staging Baseline Implementation

on:
  workflow_call:

permissions:
  actions: read
  contents: read
  packages: read
  id-token: write
  attestations: write

concurrency:
  group: trinyx-historical-staging-baseline
  cancel-in-progress: false

jobs:
  baseline:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout trusted baseline builder
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
      - name: Verify trusted builder checkout
        env:
          TRUSTED_BUILDER_COMMIT: ${{ job.workflow_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TRUSTED_BUILDER_COMMIT"
          [[ "$TRUSTED_BUILDER_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test -z "$(git status --porcelain=v1 --untracked-files=all --ignored)"
      - name: Checkout exact historical source as data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: aeb2a447ea7ce0436a60549713636225dfe1a2c1
          path: historical-source
          persist-credentials: false
      - name: Authenticate historical GitHub publication evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          source_commit=aeb2a447ea7ce0436a60549713636225dfe1a2c1
          test "$(git -C historical-source rev-parse HEAD)" = "$source_commit"
          mkdir -p historical-input/paid
          gh api /repos/TrinyxAI/Trinyx/actions/runs/33444272417 > historical-input/backend-run.json
          gh api /repos/TrinyxAI/Trinyx/actions/runs/33444302902 > historical-input/frontend-run.json
          gh api /repos/TrinyxAI/Trinyx/actions/jobs/99660712771 > historical-input/backend-publish-job.json
          gh api /repos/TrinyxAI/Trinyx/actions/jobs/99659777935 > historical-input/frontend-publish-job.json
          gh api --allow-escape-sequences /repos/TrinyxAI/Trinyx/actions/jobs/99660712771/logs > historical-input/backend-publish.log
          gh api --allow-escape-sequences /repos/TrinyxAI/Trinyx/actions/jobs/99659777935/logs > historical-input/frontend-publish.log
          gh api /repos/TrinyxAI/Trinyx/actions/runs/33444272417/artifacts \
            --jq '.artifacts[] | select(.id == 9777989306)' > historical-input/artifact.json
          test "$(jq -r .id historical-input/artifact.json)" = 9777989306
          gh api /repos/TrinyxAI/Trinyx/actions/artifacts/9777989306/zip > historical-input/cloud.zip
          printf '%s  %s\n' \
            '8cb6a3b52b7deff90bebcceb6435a5c66d6d1a06e45c32b8350427efe4059ac0' \
            historical-input/cloud.zip | sha256sum --check --strict
          python3 platform/release/validate-historical-artifact.py \
            --zip historical-input/cloud.zip \
            --out historical-input/cloud \
            --expected-file cloud-image-manifest.json
          test -f historical-input/cloud/cloud-image-manifest.json
      - name: Authenticate to GHCR for read-only metadata inspection
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Inspect immutable Paid image provenance without pull
        shell: bash
        run: |
          set -euo pipefail
          inspect() {
            local package="$1" out="$2"
            local tag="${package}:aeb2a447ea7ce0436a60549713636225dfe1a2c1"
            local inspection digest image platform labels
            printf 'HISTORICAL_PAID_INSPECT package=%s\n' "$package"
            inspection=$(docker buildx imagetools inspect "$tag" --format '{{json .}}')
            digest=$(jq -er '
              .manifest.digest
              | select(type == "string" and test("^sha256:[0-9a-f]{64}$"))
            ' <<<"$inspection")
            image=$(jq -ce '.image | select(type == "object" and (.config | type == "object"))' <<<"$inspection")
            platform=$(jq -ce '
              select(type == "object")
              | {os: .os, architecture: .architecture}
              | select(.os == "linux" and .architecture == "amd64")
            ' <<<"$image")
            labels=$(jq -ce '
              select(type == "object")
              | (.config.Labels // {})
              | select(type == "object")
            ' <<<"$image")
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            jq -n --arg package "$package" --arg tag "$tag" --arg digest "$digest" \
              --argjson platform "$platform" --argjson labels "$labels" \
              '{package:$package,tag:$tag,digest:$digest,platform:$platform,labels:$labels}' > "$out"
          }
          inspect ghcr.io/trinyxai/trinyx-backend historical-input/paid/backend-inspect.json
          inspect ghcr.io/trinyxai/trinyx-frontend historical-input/paid/frontend-inspect.json
      - name: Validate evidence and construct canonical Paid manifests
        shell: bash
        run: |
          set -euo pipefail
          python3 platform/release/historical_baseline.py \
            --backend-run historical-input/backend-run.json \
            --frontend-run historical-input/frontend-run.json \
            --artifact historical-input/artifact.json \
            --backend-job historical-input/backend-publish-job.json \
            --frontend-job historical-input/frontend-publish-job.json \
            --backend-log historical-input/backend-publish.log \
            --frontend-log historical-input/frontend-publish.log \
            --cloud-manifest historical-input/cloud/cloud-image-manifest.json \
            --inventory platform/release/runtime-inventory.json \
            --historical-inventory historical-source/docker/cloud-images.json \
            --backend-inspect historical-input/paid/backend-inspect.json \
            --frontend-inspect historical-input/paid/frontend-inspect.json \
            --out historical-input/paid
      - name: Assemble canonical 28-image inventory
        shell: bash
        run: |
          set -euo pipefail
          python3 platform/release/assemble-release-images.py \
            --source-commit aeb2a447ea7ce0436a60549713636225dfe1a2c1 \
            --inventory platform/release/runtime-inventory.json \
            --manifest historical-input/paid/cloud.json \
            --manifest historical-input/paid/backend.json \
            --manifest historical-input/paid/frontend.json \
            --manifest platform/release/third-party-images.json \
            --out release-images.json
          python3 platform/release/validate-runtime-images.py \
            --contract platform/release/runtime-inventory.json --images release-images.json
      - name: Prepare authenticated historical bundle source
        env:
          TRUSTED_BUILDER_COMMIT: ${{ job.workflow_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C historical-source rev-parse HEAD)" = aeb2a447ea7ce0436a60549713636225dfe1a2c1
          test -z "$(git -C historical-source status --porcelain=v1 --untracked-files=all --ignored)"
          python3 platform/release/prepare-historical-bundle-source.py \
            --historical-repo historical-source \
            --trusted-repo . \
            --trusted-commit "$TRUSTED_BUILDER_COMMIT" \
            --approved-environment-config platform/bootstrap/paid/staging/rootfs/etc/trinyx/staging/paid/config/paid.override.yml \
            --source-contract platform/release/historical-deployment-bundle-sources.json \
            --bundle-contract platform/release/deployment-bundle-files.json \
            --out historical-bundle-source
      - name: Verify Paid runtime render from authenticated bundle origins
        shell: bash
        run: |
          set -euo pipefail
          python3 - release-images.json historical-input/paid/images.env <<'PY'
          import json
          import re
          import sys

          images_path, output_path = sys.argv[1:]
          document = json.load(open(images_path, encoding="utf-8"))
          if not isinstance(document, dict) or set(document) != {"schemaVersion", "sourceCommit", "images"}:
              raise SystemExit("ERROR: canonical Paid runtime inventory schema mismatch")
          if type(document["schemaVersion"]) is not int or document["schemaVersion"] != 1:
              raise SystemExit("ERROR: canonical Paid runtime inventory schema version mismatch")
          if not isinstance(document["sourceCommit"], str) or not re.fullmatch(r"[0-9a-f]{40}", document["sourceCommit"]):
              raise SystemExit("ERROR: canonical Paid runtime inventory source binding is invalid")
          if not isinstance(document.get("images"), list):
              raise SystemExit("ERROR: canonical Paid runtime inventory is not an object with images")
          image_keys = {
              "name", "role", "service", "package", "environment", "digest", "immutableRef",
          }
          if any(
              not isinstance(item, dict)
              or set(item) != image_keys
              or any(not isinstance(item[key], str) for key in image_keys)
              for item in document["images"]
          ):
              raise SystemExit("ERROR: canonical runtime image entry schema mismatch")
          paid_items = [item for item in document["images"] if item["role"] == "paid"]
          if len(paid_items) != 8:
              raise SystemExit("ERROR: canonical Paid runtime inventory is not exactly eight services")
          services = [item.get("service") for item in paid_items]
          expected_services = {
              "postgres", "redis", "minio", "minio-init",
              "bridge", "livecontext", "frontend", "paid-edge",
          }
          if (
              any(not isinstance(service, str) for service in services)
              or len(set(services)) != 8
              or set(services) != expected_services
          ):
              raise SystemExit("ERROR: canonical Paid runtime service bindings are not exactly eight unique services")
          expected = {
              item["service"]: (item["environment"], item["immutableRef"])
              for item in paid_items
          }
          if (
              len(expected) != len(paid_items)
              or len({environment for environment, _ in expected.values()}) != len(expected)
          ):
              raise SystemExit("ERROR: canonical Paid runtime bindings are not unique")
          if any(
              not re.fullmatch(r"[A-Z][A-Z0-9_]*", environment)
              or not re.fullmatch(r"[^@\s]+@sha256:[0-9a-f]{64}", immutable_ref)
              for environment, immutable_ref in expected.values()
          ):
              raise SystemExit("ERROR: canonical Paid runtime image binding is invalid")
          with open(output_path, "w", encoding="utf-8") as output:
              for _, (environment, immutable_ref) in sorted(expected.items()):
                  output.write(f"{environment}={immutable_ref}\n")
          PY
          docker compose --env-file historical-input/paid/images.env \
            -f historical-bundle-source/docker-compose.yml \
            -f platform/bootstrap/paid/staging/rootfs/etc/trinyx/staging/paid/config/paid.override.yml \
            -f historical-bundle-source/docker/docker-compose.paid.runtime.yml \
            config --format json \
            postgres redis minio minio-init bridge livecontext frontend paid-edge \
            > historical-input/paid/rendered-compose.json
          python3 - release-images.json historical-input/paid/rendered-compose.json <<'PY'
          import json
          import re
          import sys

          images_path, rendered_path = sys.argv[1:]
          document = json.load(open(images_path, encoding="utf-8"))
          images = document.get("images") if isinstance(document, dict) else None
          rendered = json.load(open(rendered_path, encoding="utf-8"))
          if not isinstance(rendered, dict) or set(rendered) != {"services"}:
              raise SystemExit("ERROR: canonical Paid runtime render schema mismatch")
          expected_services = {
              "postgres", "redis", "minio", "minio-init",
              "bridge", "livecontext", "frontend", "paid-edge",
          }
          paid_items = [
              item for item in (images or [])
              if isinstance(item, dict) and item.get("role") == "paid"
          ]
          expected = {
              item["service"]: item["immutableRef"]
              for item in paid_items
          }
          services = rendered.get("services")
          if (
              len(paid_items) != 8
              or set(expected) != expected_services
              or len(expected) != len(paid_items)
              or not isinstance(services, dict)
              or set(services) != expected_services
          ):
              raise SystemExit("ERROR: canonical Paid runtime service inventory mismatch")
          for service, immutable_ref in expected.items():
              rendered_service = services[service]
              if not isinstance(rendered_service, dict) or set(rendered_service) < {"image"}:
                  raise SystemExit(
                      f"ERROR: canonical Paid runtime rendered service schema mismatch: {service}"
                  )
              actual = rendered_service["image"]
              if not isinstance(actual, str) or actual != immutable_ref or not re.fullmatch(
                  r"[^@\s]+@sha256:[0-9a-f]{64}", actual
              ):
                  raise SystemExit(
                      f"ERROR: canonical Paid runtime image render mismatch: {service}"
                  )
          print("HISTORICAL_PAID_RUNTIME_RENDER_OK services=8")
          PY
      - name: Build deterministic bundle from authenticated source origins
        shell: bash
        run: |
          set -euo pipefail
          python3 platform/release/build-deployment-bundle.py \
            --repo historical-bundle-source \
            --contract platform/release/deployment-bundle-files.json \
            --out deployment-bundle.tar \
            --manifest-out deployment-bundle.json
          jq -e '
            (.files | type == "array" and length > 0)
            and all(
              .files[];
              type == "object"
              and (.mode == 420 or .mode == 493)
            )
          ' deployment-bundle.json >/dev/null
      - name: Create canonical release manifest
        env:
          TRUSTED_BUILDER_COMMIT: ${{ job.workflow_sha }}
          SOURCE_REF: refs/heads/codex/trinyx-cloud-gateway-v2
        shell: bash
        run: |
          set -euo pipefail
          created_at=$(jq -er '
            .created_at
            | select(type == "string" and test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$"))
          ' historical-input/backend-run.json)
          python3 platform/release/release.py create \
            --source-commit aeb2a447ea7ce0436a60549713636225dfe1a2c1 \
            --source-ref "$SOURCE_REF" \
            --platform-commit "$TRUSTED_BUILDER_COMMIT" \
            --created-at "$created_at" \
            --images release-images.json \
            --bundle-manifest deployment-bundle.json \
            --out release.json
          python3 platform/release/release.py validate --manifest release.json
          jq -er '.releaseId | test("^rel-v1-[0-9a-f]{32}$")' release.json >/dev/null
      - name: Upload canonical historical baseline
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: trinyx-historical-staging-baseline-aeb2a447ea7ce0436a60549713636225dfe1a2c1
          path: |
            release.json
            release-images.json
            deployment-bundle.json
            deployment-bundle.tar
          if-no-files-found: error
          retention-days: 365
      - name: Attest exact canonical baseline subjects
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: |
            release.json
            release-images.json
            deployment-bundle.json
            deployment-bundle.tar
