name: Build Trinyx Backend

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/app/contact/**'
      - 'frontend/components/about/**'
      - 'docker-compose.yml'
      - '.github/workflows/build-trinyx-backend.yml'
      - '.github/workflows/build-trinyx-cloud-images.yml'
      - 'scripts/validate-cloud-publisher-bootstrap.mjs'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/app/contact/**'
      - 'frontend/components/about/**'
      - 'docker-compose.yml'
      - '.github/workflows/build-trinyx-backend.yml'
      - '.github/workflows/build-trinyx-cloud-images.yml'
      - 'scripts/validate-cloud-publisher-bootstrap.mjs'
  workflow_dispatch:
    inputs:
      operation:
        description: Narrow pre-merge bridge; live operations remain staging Environment gated
        type: choice
        required: true
        default: release-candidate
        options:
          - release-candidate
          - staging-oidc-probe
          - staging-release-register
          - staging-legacy-adopt
          - staging-qualification
      run_id:
        required: false
        type: string
        default: '33485509832'
      artifact_id:
        required: false
        type: string
        default: '9791964215'
      artifact_digest:
        required: false
        type: string
        default: 'sha256:755594078d9da7e19406e01187534132920a31f87804c1b33baa28fa96559152'
      source_commit:
        required: false
        type: string
        default: 'f3a4c1ddcf6a17bfc837071f9046ac4c38a38b47'
      release_id:
        required: false
        type: string
        default: 'rel-v1-b5ba70c23b9f529ac8228a7b00b4faa4'
      bundle_digest:
        required: false
        type: string
        default: 'sha256:c9df14dcd1dbc24b31b926d3778bef2e208b59824c78f24292608284f3579892'
      baseline_run_id:
        required: false
        type: string
      baseline_artifact_id:
        required: false
        type: string
      baseline_artifact_digest:
        required: false
        type: string
      baseline_source_commit:
        required: false
        type: string
      baseline_release_id:
        required: false
        type: string
      baseline_bundle_digest:
        required: false
        type: string
      candidate_artifact_id:
        required: false
        type: string
        default: '9791964215'
      candidate_run_id:
        required: false
        type: string
        default: '33485509832'
      candidate_artifact_digest:
        required: false
        type: string
        default: 'sha256:755594078d9da7e19406e01187534132920a31f87804c1b33baa28fa96559152'
      candidate_source_commit:
        required: false
        type: string
        default: 'f3a4c1ddcf6a17bfc837071f9046ac4c38a38b47'
      candidate_release_id:
        required: false
        type: string
        default: 'rel-v1-b5ba70c23b9f529ac8228a7b00b4faa4'
      candidate_bundle_digest:
        required: false
        type: string
        default: 'sha256:c9df14dcd1dbc24b31b926d3778bef2e208b59824c78f24292608284f3579892'
      environment_config_revision:
        required: false
        type: string
      registry_bucket:
        required: false
        type: string
      publisher_role_arn:
        required: false
        type: string
      deploy_role_arn:
        required: false
        type: string
        default: 'arn:aws:iam::001634075617:role/TrinyxStagingDeployRole'
      document_version:
        required: false
        type: string
      role_arn:
        required: false
        type: string

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/platform-release-automation' && format('trinyx-premerge-{0}-{1}', inputs.operation, github.sha) || format('trinyx-backend-{0}-{1}', github.workflow, github.event.pull_request.number || github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read

env:
  BACKEND_IMAGE: ghcr.io/trinyxai/trinyx-backend

jobs:
  release_candidate:
    name: Manual immutable release candidate build
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/platform-release-automation' && inputs.operation == 'release-candidate'
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/build-release-candidate.yml

  staging_oidc_probe:
    name: Pre-merge staging OIDC probe bridge
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/platform-release-automation' && inputs.operation == 'staging-oidc-probe'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/staging-oidc-probe-impl.yml
    with:
      role_arn: ${{ inputs.role_arn }}

  staging_release_register:
    name: Pre-merge staging release registration bridge
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/platform-release-automation' && inputs.operation == 'staging-release-register'
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    uses: ./.github/workflows/staging-release-register-impl.yml
    with:
      run_id: ${{ inputs.run_id }}
      artifact_id: ${{ inputs.artifact_id }}
      artifact_digest: ${{ inputs.artifact_digest }}
      source_commit: ${{ inputs.source_commit }}
      release_id: ${{ inputs.release_id }}
      bundle_digest: ${{ inputs.bundle_digest }}
      registry_bucket: ${{ inputs.registry_bucket }}
      publisher_role_arn: ${{ inputs.publisher_role_arn }}

  staging_legacy_adopt:
    name: Pre-merge proven legacy baseline adoption bridge
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/platform-release-automation' && inputs.operation == 'staging-legacy-adopt'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/staging-legacy-adopt-impl.yml
    with:
      baseline_release_id: ${{ inputs.baseline_release_id }}
      baseline_bundle_digest: ${{ inputs.baseline_bundle_digest }}
      environment_config_revision: ${{ inputs.environment_config_revision }}
      registry_bucket: ${{ inputs.registry_bucket }}
      deploy_role_arn: ${{ inputs.deploy_role_arn }}
      document_version: ${{ inputs.document_version }}

  staging_qualification:
    name: Pre-merge staging qualification bridge
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/platform-release-automation' && inputs.operation == 'staging-qualification'
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    uses: ./.github/workflows/staging-qualification-impl.yml
    with:
      baseline_run_id: ${{ inputs.baseline_run_id }}
      baseline_artifact_id: ${{ inputs.baseline_artifact_id }}
      baseline_artifact_digest: ${{ inputs.baseline_artifact_digest }}
      baseline_source_commit: ${{ inputs.baseline_source_commit }}
      baseline_release_id: ${{ inputs.baseline_release_id }}
      baseline_bundle_digest: ${{ inputs.baseline_bundle_digest }}
      candidate_artifact_id: ${{ inputs.candidate_artifact_id }}
      candidate_run_id: ${{ inputs.candidate_run_id }}
      candidate_artifact_digest: ${{ inputs.candidate_artifact_digest }}
      candidate_release_id: ${{ inputs.candidate_release_id }}
      candidate_bundle_digest: ${{ inputs.candidate_bundle_digest }}
      candidate_source_commit: ${{ inputs.candidate_source_commit }}
      environment_config_revision: ${{ inputs.environment_config_revision }}
      registry_bucket: ${{ inputs.registry_bucket }}
      publisher_role_arn: ${{ inputs.publisher_role_arn }}
      deploy_role_arn: ${{ inputs.deploy_role_arn }}
      document_version: ${{ inputs.document_version }}

  test:
    if: github.event_name != 'workflow_dispatch' || github.ref != 'refs/heads/codex/platform-release-automation'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7, Node 24
        with:
          persist-credentials: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # actions/setup-java v6, Node 24
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile and install the required reactor graph
        run: >-
          mvn -B -Pce -DskipTests
          -pl common-lib,auth-service,catalog-service,storage-service,monolith-service
          -am install
      - name: Run paid-monolith affected tests
        run: >-
          mvn -B -Pce
          -pl common-lib,auth-service,catalog-service,storage-service,monolith-service
          -Dsurefire.failIfNoSpecifiedTests=false
          -Dtest=AppEditionProviderTest,AppEditionAutoConfigurationTest,MonolithCeConfigContractTest,WebhookControllerTest,StripeBillingServiceTest,StripeScheduleServiceTest,SubscriptionServiceTest,SubscriptionCacheBusterTest,PlanStorageQuotaSyncerTest,WebhookControllerReferralTest,CreditAttributionServiceTest,FreeSubscriptionProvisionerTest,FreeSubscriptionRenewalSchedulerTest,CreditAttributionGrantPaygTopupTest,CreditLedgerRepositoryLockIntegrationTest,CreditServiceTest,CreditServiceExactPayerTest,CreditControllerTest,CreditConsumptionClientTest,GatewayAuthenticationFilterTest,ServiceRouteAuthenticationTest,ModelPricingServiceTest,PlanLimitServiceTest,BillingControllerTest,BillingControllerIntegrationTest,StripeHealthIndicatorTest,WorkloadAuthenticationServiceTest,CloudCreditAuthorityControllerTest,ExternalCreditProxyServiceTest,CloudSettlementOutboxDispatcherTest,CloudSettlementResultWriterTest,WorkspaceDataPurgerTest,WorkspaceStorageErasureOutboxTest,WorkspaceStorageErasureDispatcherTest,RedisExternalSettlementIntentStoreTest,CreditConsumptionClientAmbiguousOutcomeTest,WorkspaceStorageObjectDeleterWiringTest,S3FileStorageServiceTest,StorageApplicationYamlTest,ApiCatalogMergeServiceTest,ApiCatalogBundleSqlIntegrationTest,ApiCatalogBundleApplierTest,CloudLinkConfigTopologyTest
          test

  frontend-test:
    if: github.event_name != 'workflow_dispatch' || github.ref != 'refs/heads/codex/platform-release-automation'
    name: frontend-test (${{ matrix.mode }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: ce
            app-edition: ce
            auth-mode: ''
            billing-enabled: ''
          - mode: paid-monolith
            app-edition: paid-monolith
            auth-mode: embedded
            billing-enabled: 'true'
          - mode: cloud
            app-edition: cloud
            auth-mode: oidc
            billing-enabled: ''
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_APP_EDITION: ${{ matrix.app-edition }}
      NEXT_PUBLIC_AUTH_MODE: ${{ matrix.auth-mode }}
      NEXT_PUBLIC_BILLING_ENABLED: ${{ matrix.billing-enabled }}
      NEXT_PUBLIC_SPRING_BASE_URL: http://livecontext-app:8080
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7, Node 24
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # actions/setup-node v7, Node 24
        with:
          node-version: '22.13'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Restore npm optional native binding
        run: npm install --no-save @rolldown/binding-linux-x64-gnu
      - name: Run edition frontend tests
        run: >-
          npx vitest run
          __tests__/lib/edition/edition.test.ts
          __tests__/components/settings/settingsNavItems.test.ts
          components/billing/__tests__/CancellationModal.test.tsx
          components/settings/__tests__/VersionCard.test.tsx
          components/app/__tests__/SidePanel.detach.test.tsx
          components/app/__tests__/WorkflowBuilderPanelContent.dispatch.test.tsx
          components/app/__tests__/WorkflowPanelContent.canvasActions.test.tsx
          app/workflows/builder/components/__tests__/BuilderCanvas.runControlsWiring.test.tsx
          components/workflow/relations/__tests__/WorkflowRelationsMenu.test.tsx
          components/files/__tests__/FileBrowser.navigation.test.tsx
          app/contact/__tests__/contact-page.test.tsx
          components/about/__tests__/AboutInformationContent.test.tsx
      - name: Build frontend (${{ matrix.mode }})
        run: npm run build

  build-pr:
    if: github.event_name == 'pull_request'
    needs: [test, frontend-test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7, Node 24
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # docker/setup-buildx-action v4, Node 24
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # docker/login-action v4, Node 24
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build backend monolith image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # docker/build-push-action v7, Node 24
        with:
          context: ./backend
          file: ./backend/monolith-service/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=trinyx-backend
          cache-to: type=gha,mode=max,scope=trinyx-backend

      - name: Smoke boot CE defaults, key persistence and paid-monolith CloudLink
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          network="trinyx-ce-smoke"
          keys_volume="trinyx-ce-smoke-keys"
          cleanup() {
            docker rm -f ce-smoke-backend ce-smoke-postgres ce-smoke-redis ce-smoke-minio >/dev/null 2>&1 || true
            docker network rm "${network}" >/dev/null 2>&1 || true
            docker volume rm -f "${keys_volume}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          cleanup
          docker network create "${network}" >/dev/null
          docker volume create "${keys_volume}" >/dev/null

          docker run -d --name ce-smoke-postgres --network "${network}" \
            -e POSTGRES_DB=livecontext -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres \
            pgvector/pgvector:0.8.1-pg16 >/dev/null
          docker run -d --name ce-smoke-redis --network "${network}" redis:7.4.11-alpine >/dev/null
          docker run -d --name ce-smoke-minio --network "${network}" \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:RELEASE.2025-07-23T15-54-02Z server /data >/dev/null

          for attempt in {1..60}; do
            if docker exec ce-smoke-postgres pg_isready -U postgres >/dev/null 2>&1 \
                && docker exec ce-smoke-redis redis-cli ping >/dev/null 2>&1; then
              break
            fi
            if [ "${attempt}" -eq 60 ]; then
              echo "CE smoke dependencies did not become ready" >&2
              exit 1
            fi
            sleep 2
          done

          docker run --rm --network "${network}" --entrypoint /bin/sh minio/mc:RELEASE.2025-07-21T05-28-08Z -c '
            until mc alias set smoke http://ce-smoke-minio:9000 minioadmin minioadmin >/dev/null 2>&1; do sleep 2; done
            mc mb --ignore-existing smoke/workflow-files >/dev/null
          '

          common_args=(
            --network "${network}" -p 18080:8080
            -e DB_HOST=ce-smoke-postgres -e DB_PORT=5432 -e DB_NAME=livecontext
            -e DB_USERNAME=postgres -e DB_PASSWORD=postgres
            -e REDIS_HOST=ce-smoke-redis -e REDIS_PORT=6379
            -e STORAGE_S3_ENDPOINT=http://ce-smoke-minio:9000
            -e STORAGE_S3_ACCESS_KEY=minioadmin -e STORAGE_S3_SECRET_KEY=minioadmin
            -e STORAGE_S3_BUCKET=workflow-files
            -v "${keys_volume}:/app/data/keys"
          )

          start_backend() {
            docker run -d --name ce-smoke-backend "${common_args[@]}" "$@" \
              "${BACKEND_IMAGE}:${GITHUB_SHA}" >/dev/null
          }

          wait_for_backend() {
            label="$1"
            health_path="${2:-/actuator/health}"
            for attempt in {1..120}; do
              if curl --fail --silent "http://127.0.0.1:18080${health_path}" >/dev/null; then
                echo "${label} smoke boot succeeded via ${health_path}"
                return 0
              fi
              if ! docker ps --format '{{.Names}}' | grep -qx ce-smoke-backend; then
                echo "${label} backend exited during smoke boot" >&2
                docker logs ce-smoke-backend >&2 || true
                return 1
              fi
              sleep 5
            done
            echo "${label} backend did not become healthy within 10 minutes" >&2
            docker logs ce-smoke-backend >&2 || true
            return 1
          }

          # Defaults are intentionally omitted: marketplace=remote and cloud-link.enabled=false.
          start_backend
          wait_for_backend "CE default"
          first_key_checksum="$(docker exec ce-smoke-backend sha256sum /app/data/keys/encryption.env | awk '{print $1}')"
          test -n "${first_key_checksum}"

          docker rm -f ce-smoke-backend >/dev/null
          start_backend
          wait_for_backend "CE recreated"
          second_key_checksum="$(docker exec ce-smoke-backend sha256sum /app/data/keys/encryption.env | awk '{print $1}')"
          test "${first_key_checksum}" = "${second_key_checksum}"
          echo "CE encryption keys survived container recreation"

          docker rm -f ce-smoke-backend >/dev/null
          start_backend -e APP_EDITION=paid-monolith -e MARKETPLACE_MODE=local -e CLOUD_LINK_ENABLED=true \
            -e CREDIT_UNLIMITED=false -e PLAN_LIMITS_ENABLED=true -e BILLING_PROVIDER=stripe \
            -e MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED=true
          # The aggregate health endpoint is intentionally DOWN without a real Stripe secret.
          # Liveness proves the Spring process booted without weakening the paid runtime contract.
          wait_for_backend "Paid monolith local Marketplace + CloudLink" "/actuator/health/liveness"
          paid_version="$(curl --fail --silent http://127.0.0.1:18080/api/version)"
          grep -q '"edition":"paid-monolith"' <<<"${paid_version}"
          echo "Paid monolith edition contract confirmed"

  publish:
    if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || github.ref != 'refs/heads/codex/platform-release-automation')
    needs: [test, frontend-test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7, Node 24
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # docker/setup-buildx-action v4, Node 24
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # docker/login-action v4, Node 24
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push backend monolith by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # docker/build-push-action v7, Node 24
        with:
          context: ./backend
          file: ./backend/monolith-service/Dockerfile
          platforms: linux/amd64
          outputs: type=image,name=${{ env.BACKEND_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true
          labels: |
            org.opencontainers.image.source=https://github.com/TrinyxAI/Trinyx
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=trinyx-backend
          cache-to: type=gha,mode=max,scope=trinyx-backend
      - name: Create immutable backend full-SHA tag
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "${GITHUB_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${IMAGE_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]
          sha_ref="${BACKEND_IMAGE}:${GITHUB_SHA}"
          inspect_digest() {
            docker buildx imagetools inspect "$1" 2>/dev/null |
              awk '$1 == "Digest:" { print $2; exit }'
          }
          existing="$(inspect_digest "${sha_ref}" || true)"
          if [[ -n "${existing}" && "${existing}" != "${IMAGE_DIGEST}" ]]; then
            echo "Refusing to move immutable ${sha_ref}: ${existing} != ${IMAGE_DIGEST}" >&2
            exit 1
          fi
          if [[ -z "${existing}" ]]; then
            docker buildx imagetools create \
              --tag "${sha_ref}" "${BACKEND_IMAGE}@${IMAGE_DIGEST}"
          fi
          test "$(inspect_digest "${sha_ref}")" = "${IMAGE_DIGEST}"
          echo "Backend immutable reference: ${BACKEND_IMAGE}@${IMAGE_DIGEST}" >> "${GITHUB_STEP_SUMMARY}"

  publish-cloud-runtime:
    if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/codex/platform-release-automation'
    needs: [test, frontend-test, publish]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-trinyx-cloud-images.yml
    with:
      publish: true
