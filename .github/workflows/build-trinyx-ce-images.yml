name: Build Trinyx CE runtime images

on:
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "mcp/**"
      - "screenshot-renderer/**"
      - "websearch-service/**"
      - "cli/assets/docker-compose.yml"
      - "cli/package.json"
      - ".github/workflows/build-trinyx-ce-images.yml"
      - ".github/workflows/build-trinyx-ce-images-impl.yml"
  push:
    tags:
      - "v*"
  workflow_dispatch:


permissions:
  contents: read

jobs:
  run:
    permissions:
      contents: write
      id-token: write
      packages: write
    uses: ./.github/workflows/build-trinyx-ce-images-impl.yml
