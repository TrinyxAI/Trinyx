name: Build Trinyx CE runtime images

on:
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "mcp/**"
      - "screenshot-renderer/**"
      - "websearch-service/**"
      - "cli/assets/docker-compose.yml"
      - ".github/workflows/build-trinyx-ce-images.yml"
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: trinyx-ce-images-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./backend
            file: ./backend/monolith-service/Dockerfile
            image: ghcr.io/trinyxai/trinyx-ce
            build_args: ""
          - name: bridge
            context: ./mcp
            file: ./mcp/bridge/Dockerfile
            image: ghcr.io/trinyxai/trinyx-ce-bridge
            build_args: ""
          - name: frontend
            context: ./frontend
            file: ./frontend/Dockerfile
            image: ghcr.io/trinyxai/trinyx-ce-frontend
            build_args: |
              NEXT_PUBLIC_APP_EDITION=ce
              NEXT_PUBLIC_AUTH_MODE=embedded
              NEXT_PUBLIC_BILLING_ENABLED=false
          - name: screenshot-renderer
            context: ./screenshot-renderer
            file: ./screenshot-renderer/Dockerfile
            image: ghcr.io/trinyxai/trinyx-ce-screenshot-renderer
            build_args: ""
          - name: websearch
            context: ./websearch-service
            file: ./websearch-service/Dockerfile
            image: ghcr.io/trinyxai/trinyx-ce-websearch
            build_args: ""
    steps:
      - uses: actions/checkout@v4
      - name: Resolve and validate release aliases
        id: release
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != refs/tags/v* ]]; then
            {
              echo "patch="
              echo "minor="
              echo "major="
            } >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if [[ ! "${GITHUB_REF_NAME}" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Release tags must use exact stable semver: vX.Y.Z" >&2
            exit 1
          fi

          release_major="${BASH_REMATCH[1]}"
          release_minor="${BASH_REMATCH[2]}"
          package_version="$(node -p "require('./cli/package.json').version")"
          if [[ "v${package_version}" != "${GITHUB_REF_NAME}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match cli/package.json version ${package_version}" >&2
            exit 1
          fi

          {
            echo "patch=${GITHUB_REF_NAME}"
            echo "minor=v${release_major}.${release_minor}"
            echo "major=v${release_major}"
          } >> "${GITHUB_OUTPUT}"
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build ${{ matrix.name }}
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: |
            ${{ matrix.image }}:${{ github.sha }}
            ${{ steps.release.outputs.patch != '' && format('{0}:{1}', matrix.image, steps.release.outputs.patch) || '' }}
            ${{ steps.release.outputs.minor != '' && format('{0}:{1}', matrix.image, steps.release.outputs.minor) || '' }}
            ${{ steps.release.outputs.major != '' && format('{0}:{1}', matrix.image, steps.release.outputs.major) || '' }}
            ${{ startsWith(github.ref, 'refs/tags/v') && format('{0}:latest', matrix.image) || '' }}
          provenance: ${{ startsWith(github.ref, 'refs/tags/v') && 'mode=max' || 'false' }}
          sbom: ${{ startsWith(github.ref, 'refs/tags/v') }}
          build-args: ${{ matrix.build_args }}
          cache-from: type=gha,scope=trinyx-ce-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=trinyx-ce-${{ matrix.name }}

      - name: Record immutable release digest
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          echo "### ${{ matrix.name }}" >> "${GITHUB_STEP_SUMMARY}"
          echo "\`${{ matrix.image }}@${{ steps.build.outputs.digest }}\`" >> "${GITHUB_STEP_SUMMARY}"
