name: Build Trinyx CE runtime images

on:
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "mcp/**"
      - "screenshot-renderer/**"
      - "websearch-service/**"
      - "cli/assets/docker-compose.yml"
      - ".github/workflows/build-trinyx-ce-images.yml"
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: trinyx-ce-images-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./backend
            file: ./backend/monolith-service/Dockerfile
            image: ghcr.io/trinyxai/trinyx-ce
            build_args: ""
          - name: bridge
            context: ./mcp
            file: ./mcp/bridge/Dockerfile
            image: ghcr.io/trinyxai/trinyx-ce-bridge
            build_args: ""
          - name: frontend
            context: ./frontend
            file: ./frontend/Dockerfile
            image: ghcr.io/trinyxai/trinyx-ce-frontend
            build_args: |
              NEXT_PUBLIC_APP_EDITION=ce
              NEXT_PUBLIC_AUTH_MODE=embedded
              NEXT_PUBLIC_BILLING_ENABLED=false
          - name: screenshot-renderer
            context: ./screenshot-renderer
            file: ./screenshot-renderer/Dockerfile
            image: ghcr.io/trinyxai/trinyx-ce-screenshot-renderer
            build_args: ""
          - name: websearch
            context: ./websearch-service
            file: ./websearch-service/Dockerfile
            image: ghcr.io/trinyxai/trinyx-ce-websearch
            build_args: ""
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: |
            ${{ matrix.image }}:${{ github.sha }}
            ${{ startsWith(github.ref, 'refs/tags/v') && format('{0}:{1}', matrix.image, github.ref_name) || '' }}
            ${{ startsWith(github.ref, 'refs/tags/v') && format('{0}:latest', matrix.image) || '' }}
          build-args: ${{ matrix.build_args }}
          cache-from: type=gha,scope=trinyx-ce-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=trinyx-ce-${{ matrix.name }}
