name: Build Trinyx Frontends

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/build-trinyx-frontend.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

env:
  APP_IMAGE: ghcr.io/eddinerabii/trinyx-frontend
  LANDING_IMAGE: ghcr.io/eddinerabii/trinyx-landing
  AWS_REGION: eu-north-1
  EC2_INSTANCE_ID: i-025faee9cb435ad89

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Trinyx app
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.APP_IMAGE }}:latest
            ${{ env.APP_IMAGE }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_APP_EDITION=ce
            NEXT_PUBLIC_AUTH_MODE=embedded
            NEXT_PUBLIC_SPRING_BASE_URL=http://livecontext-app:8080
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

      - name: Build and push Trinyx landing
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.LANDING_IMAGE }}:latest
            ${{ env.LANDING_IMAGE }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_APP_EDITION=cloud
            NEXT_PUBLIC_AUTH_MODE=oidc
            NEXT_PUBLIC_SPRING_BASE_URL=http://livecontext-app:8080
          cache-from: type=gha,scope=landing
          cache-to: type=gha,mode=max,scope=landing

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::373468206405:role/TrinyxGitHubDeployRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy frontends via SSM
        shell: bash
        run: |
          set -euo pipefail

          PARAMETERS=$(jq -n \
            --arg command "sudo -u ubuntu -H bash -lc 'set -e; cd /home/ubuntu/Trinyx; docker compose --env-file docker/.env.ce pull frontend landing; docker compose --env-file docker/.env.ce up -d frontend landing; docker compose ps frontend landing'" \
            '{commands: [$command]}')

          COMMAND_ID=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Trinyx frontends from GitHub Actions" \
            --parameters "$PARAMETERS" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM command: $COMMAND_ID"

          if ! aws ssm wait command-executed \
            --region "$AWS_REGION" \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID"; then
            aws ssm get-command-invocation \
              --region "$AWS_REGION" \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --output json || true
            exit 1
          fi

          aws ssm get-command-invocation \
            --region "$AWS_REGION" \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent,Errors:StandardErrorContent}' \
            --output json

      - name: Verify deployment
        shell: bash
        run: |
          curl --fail --silent --show-error --retry 10 --retry-delay 3 https://trinyx.fr/ > /dev/null
          curl --fail --silent --show-error --retry 10 --retry-delay 3 https://app.trinyx.fr/ > /dev/null
