name: Build Trinyx Frontends

on:
  push:
    branches: [main]
    paths: ['frontend/**', '.github/workflows/build-trinyx-frontend.yml']
  pull_request:
    paths: ['frontend/**', '.github/workflows/build-trinyx-frontend.yml']
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_IMAGE: ghcr.io/trinyxai/trinyx-frontend
  LANDING_IMAGE: ghcr.io/trinyxai/trinyx-landing

jobs:
  build-and-push:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      app_digest: ${{ steps.app.outputs.digest }}
      landing_digest: ${{ steps.landing.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7, Node 24
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # docker/setup-buildx-action v4, Node 24
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # docker/login-action v4, Node 24
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Trinyx app
        id: app
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # docker/build-push-action v7, Node 24
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.APP_IMAGE }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_APP_EDITION=paid-monolith
            NEXT_PUBLIC_AUTH_MODE=embedded
            NEXT_PUBLIC_BILLING_ENABLED=true
            NEXT_PUBLIC_SPRING_BASE_URL=http://livecontext-app:8080
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app
      - name: Build Trinyx landing
        id: landing
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # docker/build-push-action v7, Node 24
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.LANDING_IMAGE }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_APP_EDITION=cloud
            NEXT_PUBLIC_AUTH_MODE=oidc
            NEXT_PUBLIC_SPRING_BASE_URL=http://livecontext-app:8080
          cache-from: type=gha,scope=landing
          cache-to: type=gha,mode=max,scope=landing

  build-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7, Node 24
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # docker/setup-buildx-action v4, Node 24
      - name: Build Trinyx app without publication
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # docker/build-push-action v7, Node 24
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/amd64
          push: false
          tags: ${{ env.APP_IMAGE }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_APP_EDITION=paid-monolith
            NEXT_PUBLIC_AUTH_MODE=embedded
            NEXT_PUBLIC_BILLING_ENABLED=true
            NEXT_PUBLIC_SPRING_BASE_URL=http://livecontext-app:8080
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app
      - name: Build Trinyx landing without publication
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # docker/build-push-action v7, Node 24
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/amd64
          push: false
          tags: ${{ env.LANDING_IMAGE }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_APP_EDITION=cloud
            NEXT_PUBLIC_AUTH_MODE=oidc
            NEXT_PUBLIC_SPRING_BASE_URL=http://livecontext-app:8080
          cache-from: type=gha,scope=landing
          cache-to: type=gha,mode=max,scope=landing

