name: Build Trinyx Frontends

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/build-trinyx-frontend.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  APP_IMAGE: ghcr.io/eddinerabii/trinyx-frontend
  LANDING_IMAGE: ghcr.io/eddinerabii/trinyx-landing

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Trinyx app
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.APP_IMAGE }}:latest
            ${{ env.APP_IMAGE }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_APP_EDITION=ce
            NEXT_PUBLIC_AUTH_MODE=embedded
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

      - name: Build and push Trinyx landing
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.LANDING_IMAGE }}:latest
            ${{ env.LANDING_IMAGE }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_APP_EDITION=cloud
            NEXT_PUBLIC_AUTH_MODE=oidc
          cache-from: type=gha,scope=landing
          cache-to: type=gha,mode=max,scope=landing

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        shell: bash
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/trinyx_deploy
          chmod 600 ~/.ssh/trinyx_deploy
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy frontends to EC2
        shell: bash
        run: |
          ssh -i ~/.ssh/trinyx_deploy "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" <<'EOF'
            set -e
            cd ~/Trinyx
            docker compose --env-file docker/.env.ce pull frontend landing
            docker compose --env-file docker/.env.ce up -d frontend landing
            docker compose ps frontend landing
          EOF

      - name: Verify deployment
        shell: bash
        run: |
          curl --fail --silent --show-error --retry 10 --retry-delay 3 https://trinyx.fr/ > /dev/null
          curl --fail --silent --show-error --retry 10 --retry-delay 3 https://app.trinyx.fr/ > /dev/null
