name: Fix rail logo once

on:
  push:
    branches:
      - fix-hero-flow-branding-cleanup

permissions:
  contents: write

jobs:
  patch-rail-logo:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-hero-flow-branding-cleanup
          fetch-depth: 0

      - name: Replace hardcoded legacy rail mark
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('frontend/public/hero-flow.html')
          text = path.read_text(encoding='utf-8')

          pattern = r'<div class="logo"><svg\b.*?</svg></div>'
          replacement = '<div class="logo"><img src="/branding/trinyx-mark.png" alt="Trinyx" /></div>'
          text, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'Expected exactly one hardcoded rail logo, found {count}')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify and commit
        shell: bash
        run: |
          grep -F -- '<div class="logo"><img src="/branding/trinyx-mark.png" alt="Trinyx" /></div>' frontend/public/hero-flow.html
          if grep -F -- '<div class="logo"><svg' frontend/public/hero-flow.html; then
            echo 'Legacy hardcoded rail logo still present'
            exit 1
          fi

          rm .github/workflows/fix-rail-logo-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Replace legacy rail logo with Trinyx mark'
          git push origin HEAD:fix-hero-flow-branding-cleanup
