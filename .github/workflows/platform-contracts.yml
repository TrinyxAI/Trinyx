name: Platform Contracts

on:
  pull_request:
    paths:
      - 'platform/**'
      - 'docker/docker-compose.cloud.runtime.yml'
      - 'docker/docker-compose.paid.runtime.yml'
      - '.github/workflows/**'
      - 'scripts/cloud-publisher-oidc-policy.mjs'
      - 'scripts/validate-cloud-publisher-bootstrap.mjs'
      - 'scripts/validate-cloud-publisher-bootstrap.test.mjs'
  push:
    branches: [codex/platform-release-automation]
    paths:
      - 'platform/**'
      - 'docker/docker-compose.cloud.runtime.yml'
      - 'docker/docker-compose.paid.runtime.yml'
      - '.github/workflows/**'
      - 'scripts/cloud-publisher-oidc-policy.mjs'
      - 'scripts/validate-cloud-publisher-bootstrap.mjs'
      - 'scripts/validate-cloud-publisher-bootstrap.test.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-platform-assurance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          persist-credentials: false
      - name: Validate shell syntax
        shell: bash
        run: |
          set -euo pipefail
          find platform -type f -name '*.sh' -print0 | xargs -0 -r -n1 bash -n
      - name: Compile Python platform tools
        run: |
          set -euo pipefail
          find platform -type f -name '*.py' -print0 | xargs -0 -r python3 -m py_compile
      - name: Run O6-O12 unit contract fixture and failure-injection tests
        run: python3 -m unittest discover -s platform/automation/tests -v
      - name: Run reusable repository policy
        run: python3 platform/automation/static_policy.py
      - name: Test Cloud publisher OIDC boundary
        run: |
          node scripts/validate-cloud-publisher-bootstrap.mjs
          node --test scripts/validate-cloud-publisher-bootstrap.test.mjs
      - name: Validate JSON IaC and contracts
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          for path in sorted(Path('platform').rglob('*.json')):
              json.loads(path.read_text(encoding='utf-8'))
              print('JSON_OK', path)
          PY
      - name: Run existing fast release and Compose contracts
        shell: bash
        run: |
          set -euo pipefail
          for test in \
            platform/tests/test-staging-render.sh \
            platform/tests/test-host-reconciler.sh \
            platform/tests/test-release-contract.sh \
            platform/tests/test-runtime-image-lock.sh \
            platform/tests/test-release-installer.sh \
            platform/tests/test-release-build-contract.sh \
            platform/tests/test-aws-oidc-bootstrap.sh \
            platform/tests/test-aws-staging-deploy-control-plane.sh \
            platform/tests/test-release-workflow-boundary.sh
          do
            bash "$test"
          done
      - name: Reject secret signatures
        shell: bash
        run: |
          set -euo pipefail
          if grep -RIEq --exclude='platform-contracts.yml' -- \
            '-----BEGIN ([A-Z0-9 ]+ )?PRIVATE KEY-----|AKIA[0-9A-Z]{16}|ASIA[0-9A-Z]{16}|sk_live_[A-Za-z0-9]+|sk_test_[A-Za-z0-9]+|whsec_[A-Za-z0-9]+|github_pat_[A-Za-z0-9_]+|ghp_[A-Za-z0-9]+' \
            platform/
          then
            echo 'ERROR_PLATFORM_SECRET_SIGNATURE_FOUND' >&2
            exit 1
          fi
      - name: Prove platform CI build and live boundary
        run: |
          echo 'PLATFORM_FAST_CI_OK'
          echo 'APPLICATION_IMAGE_BUILD_EXECUTED=NO'
          echo 'LIVE_STAGING_CONTACTED=NO'
