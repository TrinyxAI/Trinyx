name: Platform Release Build Contracts

on:
  pull_request:
    paths:
      - 'platform/release/**'
      - 'platform/tests/**'
      - 'scripts/validate-cloud-image-contract.mjs'
      - '.github/workflows/build-trinyx-cloud-images.yml'
      - 'docker/cloud-images.json'
      - 'docker-compose.yml'
      - 'catalog-seeds/**'
      - 'docker/docker-compose.cloud.yml'
      - 'docker/docker-compose.cloud.runtime.yml'
      - 'docker/docker-compose.paid.runtime.yml'
      - 'docker/cloud/**'
      - 'docker/paid-monolith-internal/Caddyfile'
      - '.github/workflows/build-release-candidate.yml'
      - '.github/workflows/build-release-candidate-impl.yml'
      - '.github/workflows/build-historical-staging-baseline.yml'
      - '.github/workflows/build-historical-staging-baseline-impl.yml'
      - '.github/workflows/build-trinyx-frontend.yml'
      - '.github/workflows/platform-release-build-contracts.yml'
  push:
    branches:
      - codex/platform-release-automation
    paths:
      - 'platform/release/**'
      - 'platform/tests/**'
      - 'scripts/validate-cloud-image-contract.mjs'
      - '.github/workflows/build-trinyx-cloud-images.yml'
      - 'docker/cloud-images.json'
      - 'docker-compose.yml'
      - 'catalog-seeds/**'
      - 'docker/docker-compose.cloud.yml'
      - 'docker/docker-compose.cloud.runtime.yml'
      - 'docker/docker-compose.paid.runtime.yml'
      - 'docker/cloud/**'
      - 'docker/paid-monolith-internal/Caddyfile'
      - '.github/workflows/build-release-candidate.yml'
      - '.github/workflows/build-release-candidate-impl.yml'
      - '.github/workflows/build-historical-staging-baseline.yml'
      - '.github/workflows/build-historical-staging-baseline-impl.yml'
      - '.github/workflows/build-trinyx-frontend.yml'
      - '.github/workflows/platform-release-build-contracts.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-release-build-contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-build-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify exact checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Validate release build tools
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile platform/release/release.py
          python3 -m py_compile platform/release/assemble-release-images.py
          python3 -m py_compile platform/release/build-deployment-bundle.py
          python3 -m py_compile platform/release/historical_baseline.py
          bash -n platform/tests/test-release-build-contract.sh
          bash -n platform/tests/test-release-workflow-boundary.sh
      - name: Verify immutable build manifest and bundle contracts
        run: bash platform/tests/test-release-build-contract.sh
      - name: Verify build and deploy workflow separation
        run: bash platform/tests/test-release-workflow-boundary.sh
      - name: Verify complete Cloud runtime image contract
        shell: bash
        run: |
          set -euo pipefail
          node scripts/validate-cloud-image-contract.mjs
          cp docker/.env.cloud.example /tmp/trinyx-cloud-runtime.env
          node <<'NODE'
          const fs = require('node:fs');
          const inventory = JSON.parse(fs.readFileSync('docker/cloud-images.json', 'utf8'));
          const thirdParty = JSON.parse(fs.readFileSync('platform/release/third-party-images.json', 'utf8'));
          const built = inventory.images.map((item, index) => {
            const digest = (index + 1).toString(16).padStart(64, '0');
            return item.environment + '=' + item.package + '@sha256:' + digest;
          });
          const dependencies = thirdParty.images
            .filter((item) => item.role === 'cloud')
            .map((item) => item.environment + '=' + item.immutableRef);
          if (built.length !== 14 || dependencies.length !== 6) throw new Error('bad Cloud runtime cardinality');
          fs.appendFileSync('/tmp/trinyx-cloud-runtime.env', '\n' + [...built, ...dependencies].join('\n') + '\n');
          NODE
          docker compose --env-file /tmp/trinyx-cloud-runtime.env \
            -f docker/docker-compose.cloud.yml \
            -f docker/docker-compose.cloud.runtime.yml \
            config --format json > /tmp/trinyx-cloud-runtime.json
          node scripts/validate-cloud-image-contract.mjs --rendered /tmp/trinyx-cloud-runtime.json
          echo CLOUD_RUNTIME_20_IMAGE_CONTRACT_OK
      - name: Release build contract complete
        run: echo O5_RELEASE_BUILD_CONTRACT_CI_OK
