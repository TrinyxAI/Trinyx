name: Adopt Proven Staging Baseline Implementation

on:
  workflow_call:
    inputs:
      action:
        description: 'install is install-only; normalization-plan is read-only; adopt performs the separately approved pointer transition'
        required: true
        type: string
      baseline_release_id:
        required: true
        type: string
      baseline_bundle_digest:
        required: true
        type: string
      environment_config_revision:
        required: true
        type: string
      registry_bucket:
        required: true
        type: string
      deploy_role_arn:
        required: true
        type: string
      document_version:
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: trinyx-staging-legacy-adoption
  cancel-in-progress: false

jobs:
  adopt:
    if: github.ref == 'refs/heads/codex/platform-release-automation'
    environment: staging
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CONTROL_PLANE_COMMIT: c41b17cdabb48f3405ebd8a612477fde76bc5818
    steps:
      - name: Checkout reviewed control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          ref: c41b17cdabb48f3405ebd8a612477fde76bc5818
          persist-credentials: false
      - name: Verify immutable control-plane checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CONTROL_PLANE_COMMIT"
      - name: Validate immutable identities and inputs
        shell: bash
        env:
          ACTION: ${{ inputs.action }}
          BASELINE_RELEASE_ID: ${{ inputs.baseline_release_id }}
          BASELINE_BUNDLE_DIGEST: ${{ inputs.baseline_bundle_digest }}
          CONFIG_REVISION: ${{ inputs.environment_config_revision }}
          REGISTRY_BUCKET: ${{ inputs.registry_bucket }}
          DEPLOY_ROLE_ARN: ${{ inputs.deploy_role_arn }}
          DOCUMENT_VERSION: ${{ inputs.document_version }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = TrinyxAI/Trinyx
          test "$GITHUB_REPOSITORY_ID" = 1342032975
          test "$GITHUB_REPOSITORY_OWNER_ID" = 319253481
          [[ "$ACTION" =~ ^(install|normalization-plan|adopt)$ ]]
          [[ "$BASELINE_RELEASE_ID" =~ ^rel-v1-[0-9a-f]{32}$ ]]
          [[ "$BASELINE_BUNDLE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$CONFIG_REVISION" =~ ^[A-Za-z0-9._-]{1,128}$ ]]
          [[ "$REGISTRY_BUCKET" =~ ^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$ ]]
          [[ "$DEPLOY_ROLE_ARN" =~ ^arn:aws:iam::001634075617:role/TrinyxStagingDeployRole$ ]]
          [[ "$DOCUMENT_VERSION" =~ ^[1-9][0-9]*$ ]]
      - name: Assume deploy-only AWS role
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4, Node 24
        with:
          role-to-assume: ${{ inputs.deploy_role_arn }}
          aws-region: us-east-1
          role-session-name: trinyx-staging-adopt-${{ github.run_id }}
      - name: Run read-only normalization plan or separately approved adoption
        shell: bash
        env:
          ACTION: ${{ inputs.action }}
          BASELINE_RELEASE_ID: ${{ inputs.baseline_release_id }}
          BASELINE_BUNDLE_DIGEST: ${{ inputs.baseline_bundle_digest }}
          CONFIG_REVISION: ${{ inputs.environment_config_revision }}
          REGISTRY_BUCKET: ${{ inputs.registry_bucket }}
          DOCUMENT_VERSION: ${{ inputs.document_version }}
        run: |
          set -euo pipefail
          common=(--document-version "$DOCUMENT_VERSION" --registry-bucket "$REGISTRY_BUCKET" --config-revision "$CONFIG_REVISION" --control-plane-commit "$CONTROL_PLANE_COMMIT")
          if [ "$ACTION" = normalization-plan ]; then
            python3 platform/automation/ssm_orchestrator.py normalize-plan "${common[@]}" --release-id "$BASELINE_RELEASE_ID" --bundle-digest "$BASELINE_BUNDLE_DIGEST"
            echo LEGACY_NORMALIZATION_PLAN_READ_ONLY_SUCCESS
            exit 0
          fi
          if [ "$ACTION" = install ]; then
            # C4 requires these closed protocol fields, but install does not treat them
            # as active-release preconditions. The installer enforces active_before == active_after.
            python3 platform/automation/ssm_orchestrator.py install "${common[@]}" --release-id "$BASELINE_RELEASE_ID" --bundle-digest "$BASELINE_BUNDLE_DIGEST" --previous-cloud "$BASELINE_RELEASE_ID" --previous-paid "$BASELINE_RELEASE_ID"
            echo STAGING_RELEASE_INSTALL_ONLY_SUCCESS
            exit 0
          fi
          python3 platform/automation/ssm_orchestrator.py install "${common[@]}" --release-id "$BASELINE_RELEASE_ID" --bundle-digest "$BASELINE_BUNDLE_DIGEST" --previous-cloud "$BASELINE_RELEASE_ID" --previous-paid "$BASELINE_RELEASE_ID"
          python3 platform/automation/ssm_orchestrator.py adopt "${common[@]}" --release-id "$BASELINE_RELEASE_ID" --bundle-digest "$BASELINE_BUNDLE_DIGEST"
          python3 platform/automation/ssm_orchestrator.py health "${common[@]}" --release-id "$BASELINE_RELEASE_ID" --bundle-digest "$BASELINE_BUNDLE_DIGEST" --previous-cloud "$BASELINE_RELEASE_ID" --previous-paid "$BASELINE_RELEASE_ID"
          echo LEGACY_BASELINE_POINTER_ADOPTION_SUCCESS
