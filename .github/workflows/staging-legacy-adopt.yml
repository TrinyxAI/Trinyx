name: Adopt Cryptographically Proven Staging Baseline

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Install-only, read-only normalization plan, and adoption are separate dispatches'
        required: true
        type: choice
        default: normalization-plan
        options:
          - install
          - normalization-plan
          - adopt
      baseline_release_id:
        required: true
        type: string
      baseline_bundle_digest:
        required: true
        type: string
      environment_config_revision:
        required: true
        type: string
      registry_bucket:
        required: true
        type: string
      deploy_role_arn:
        required: true
        type: string
        default: 'arn:aws:iam::001634075617:role/TrinyxStagingDeployRole'
      document_version:
        required: true
        type: string

permissions:
  contents: read

jobs:
  run:
    if: github.ref == 'refs/heads/codex/platform-release-automation'
    permissions:
      contents: read
      id-token: write
    uses: TrinyxAI/Trinyx/.github/workflows/staging-legacy-adopt-impl.yml@ec9a71e7302a4fd7f5b60475f0951c157465f3d8
    with:
      action: ${{ inputs.action }}
      baseline_release_id: ${{ inputs.baseline_release_id }}
      baseline_bundle_digest: ${{ inputs.baseline_bundle_digest }}
      environment_config_revision: ${{ inputs.environment_config_revision }}
      registry_bucket: ${{ inputs.registry_bucket }}
      deploy_role_arn: ${{ inputs.deploy_role_arn }}
      document_version: ${{ inputs.document_version }}
