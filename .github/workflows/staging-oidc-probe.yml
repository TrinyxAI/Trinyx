name: Staging OIDC STS Probe

on:
  workflow_dispatch:
    inputs:
      role_arn:
        required: true
        type: string

permissions:
  contents: read

jobs:
  run:
    if: github.ref == 'refs/heads/codex/platform-release-automation'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/staging-oidc-probe-impl.yml
    with:
      role_arn: ${{ inputs.role_arn }}
