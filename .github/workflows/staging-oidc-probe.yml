name: Staging OIDC STS Probe

on:
  workflow_dispatch:
    inputs:
      role_arn:
        description: 'CloudFormation StagingBootstrapRoleArn output'
        required: true
        type: string

permissions:
  id-token: write

concurrency:
  group: staging-oidc-probe
  cancel-in-progress: false

jobs:
  probe:
    if: github.ref == 'refs/heads/codex/platform-release-automation'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Guard repository identity and bootstrap role
        shell: bash
        env:
          ROLE_ARN: ${{ inputs.role_arn }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'TrinyxAI/Trinyx'
          test "$GITHUB_REPOSITORY_ID" = '1342032975'
          test "$GITHUB_REPOSITORY_OWNER_ID" = '319253481'
          test "$GITHUB_REF" = 'refs/heads/codex/platform-release-automation'
          [[ "$ROLE_ARN" =~ ^arn:aws:iam::[0-9]{12}:role/TrinyxStagingGitHubOidcBootstrapRole$ ]]
          echo OIDC_PROBE_CONTEXT_GUARD_OK

      - name: Exchange GitHub OIDC token for AWS identity
        shell: bash
        env:
          ROLE_ARN: ${{ inputs.role_arn }}
          AWS_REGION: us-east-1
          AWS_DEFAULT_REGION: us-east-1
        run: |
          set -euo pipefail
          umask 077

          command -v aws >/dev/null
          command -v curl >/dev/null
          command -v python3 >/dev/null

          TOKEN_FILE=$(mktemp)
          trap 'rm -f "$TOKEN_FILE"' EXIT

          curl --fail --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" \
            | python3 -c 'import json,sys; token=json.load(sys.stdin)["value"]; open(sys.argv[1],"w",encoding="utf-8").write(token)' "$TOKEN_FILE"

          test -s "$TOKEN_FILE"
          chmod 600 "$TOKEN_FILE"

          export AWS_ROLE_ARN="$ROLE_ARN"
          export AWS_WEB_IDENTITY_TOKEN_FILE="$TOKEN_FILE"
          export AWS_ROLE_SESSION_NAME="trinyx-stg-oidc-${GITHUB_RUN_ID}"

          IDENTITY=$(aws sts get-caller-identity --output json)

          CALLER_ARN=$(printf '%s' "$IDENTITY" | python3 -c 'import json,sys; print(json.load(sys.stdin)["Arn"])')
          [[ "$CALLER_ARN" =~ ^arn:aws:sts::[0-9]{12}:assumed-role/TrinyxStagingGitHubOidcBootstrapRole/trinyx-stg-oidc-[0-9]+$ ]]

          echo AWS_CALLER_ROLE=TrinyxStagingGitHubOidcBootstrapRole
          echo AWS_GITHUB_OIDC_STS_PROBE_OK
