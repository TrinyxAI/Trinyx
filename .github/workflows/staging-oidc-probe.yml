      role_arn:
        required: true
        type: string

permissions:
  contents: read

jobs:
  run:
    if: github.ref == 'refs/heads/codex/platform-release-automation'
    permissions:
      contents: read
      id-token: write
    uses: TrinyxAI/Trinyx/.github/workflows/staging-oidc-probe-impl.yml@ec9a71e7302a4fd7f5b60475f0951c157465f3d8
    with:
      role_arn: ${{ inputs.role_arn }}
