name: Staging OIDC STS Probe

on:
  workflow_dispatch:
    inputs:
      role_arn:
        required: true
        type: string

permissions:
  contents: read

jobs:
  run:
    if: github.ref == 'refs/heads/codex/platform-release-automation'
    permissions:
      contents: read
      id-token: write
    uses: TrinyxAI/Trinyx/.github/workflows/staging-oidc-probe-impl.yml@98b5efd23c18c7ce6902d6f6279bd9dc57966b8f
    with:
      role_arn: ${{ inputs.role_arn }}
