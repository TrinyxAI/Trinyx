name: Qualify Staging Deploy Rollback Redeploy Implementation

on:
  workflow_call:
    inputs:
      baseline_run_id:
        description: Baseline build workflow run ID
        required: true
        type: string
      baseline_artifact_id:
        description: Cryptographically honest baseline GitHub artifact ID
        required: true
        type: string
      baseline_artifact_digest:
        description: Baseline artifact ZIP sha256 digest
        required: true
        type: string
      baseline_release_id:
        description: Baseline immutable release ID currently active on both hosts
        required: true
        type: string
      baseline_bundle_digest:
        description: Baseline deployment bundle sha256 digest
        required: true
        type: string
      candidate_artifact_id:
        required: true
        default: '9791964215'
        type: string
      candidate_run_id:
        required: true
        default: '33485509832'
        type: string
      candidate_artifact_digest:
        required: true
        default: 'sha256:755594078d9da7e19406e01187534132920a31f87804c1b33baa28fa96559152'
        type: string
      candidate_release_id:
        required: true
        default: 'rel-v1-b5ba70c23b9f529ac8228a7b00b4faa4'
        type: string
      candidate_bundle_digest:
        required: true
        default: 'sha256:c9df14dcd1dbc24b31b926d3778bef2e208b59824c78f24292608284f3579892'
        type: string
      candidate_source_commit:
        required: true
        default: 'f3a4c1ddcf6a17bfc837071f9046ac4c38a38b47'
        type: string
      environment_config_revision:
        description: Approved non-secret staging config revision
        required: true
        type: string
      registry_bucket:
        description: Approved private registry stack output
        required: true
        type: string
      publisher_role_arn:
        required: true
        type: string
      deploy_role_arn:
        required: true
        default: 'arn:aws:iam::001634075617:role/TrinyxStagingDeployRole'
        type: string
      document_version:
        description: Reviewed numeric SSM document version, never $DEFAULT
        required: true
        type: string
      baseline_source_commit:
        description: Baseline builder source commit bound by GitHub attestation
        required: true
        type: string

permissions:
  actions: read
  attestations: write
  contents: read
  id-token: write

concurrency:
  group: trinyx-staging-live-qualification
  cancel-in-progress: false

jobs:
  qualify:
    if: github.ref == 'refs/heads/codex/platform-release-automation'
    environment: staging
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      CONTROL_PLANE_COMMIT: ee40526a1891d42cd572bf64326b365f0f68b64f
      BUILDER_WORKFLOW_COMMIT: 114a2613e8090f034925a1bcf148f055653c3a06
    steps:
      - name: Checkout reviewed control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          ref: ee40526a1891d42cd572bf64326b365f0f68b64f
          persist-credentials: false
      - name: Verify immutable control-plane checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CONTROL_PLANE_COMMIT"
      - name: Fail closed on identities and unsafe inputs
        shell: bash
        env:
          BASELINE_ARTIFACT_ID: ${{ inputs.baseline_artifact_id }}
          BASELINE_RUN_ID: ${{ inputs.baseline_run_id }}
          BASELINE_ARTIFACT_DIGEST: ${{ inputs.baseline_artifact_digest }}
          BASELINE_RELEASE_ID: ${{ inputs.baseline_release_id }}
          BASELINE_BUNDLE_DIGEST: ${{ inputs.baseline_bundle_digest }}
          CANDIDATE_ARTIFACT_ID: ${{ inputs.candidate_artifact_id }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_ARTIFACT_DIGEST: ${{ inputs.candidate_artifact_digest }}
          CANDIDATE_RELEASE_ID: ${{ inputs.candidate_release_id }}
          CANDIDATE_BUNDLE_DIGEST: ${{ inputs.candidate_bundle_digest }}
          CANDIDATE_SOURCE_COMMIT: ${{ inputs.candidate_source_commit }}
          BASELINE_SOURCE_COMMIT: ${{ inputs.baseline_source_commit }}
          CONFIG_REVISION: ${{ inputs.environment_config_revision }}
          REGISTRY_BUCKET: ${{ inputs.registry_bucket }}
          PUBLISHER_ROLE_ARN: ${{ inputs.publisher_role_arn }}
          DEPLOY_ROLE_ARN: ${{ inputs.deploy_role_arn }}
          DOCUMENT_VERSION: ${{ inputs.document_version }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY:$GITHUB_REPOSITORY_ID:$GITHUB_REPOSITORY_OWNER_ID" = 'TrinyxAI/Trinyx:1342032975:319253481'
          for id in "$BASELINE_ARTIFACT_ID" "$CANDIDATE_ARTIFACT_ID" "$BASELINE_RUN_ID" "$CANDIDATE_RUN_ID"; do [[ "$id" =~ ^[0-9]+$ ]]; done
          for value in "$BASELINE_ARTIFACT_DIGEST" "$CANDIDATE_ARTIFACT_DIGEST" "$BASELINE_BUNDLE_DIGEST" "$CANDIDATE_BUNDLE_DIGEST"; do [[ "$value" =~ ^sha256:[0-9a-f]{64}$ ]]; done
          for value in "$BASELINE_RELEASE_ID" "$CANDIDATE_RELEASE_ID"; do [[ "$value" =~ ^rel-v1-[0-9a-f]{32}$ ]]; done
          [[ "$CANDIDATE_SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$BASELINE_SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CONFIG_REVISION" =~ ^[A-Za-z0-9._-]{1,128}$ ]]
          [[ "$REGISTRY_BUCKET" =~ ^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$ ]]
          [[ "$DOCUMENT_VERSION" =~ ^[1-9][0-9]*$ ]]
          test "$PUBLISHER_ROLE_ARN" = arn:aws:iam::001634075617:role/TrinyxStagingReleasePublisherRole
          test "$DEPLOY_ROLE_ARN" = arn:aws:iam::001634075617:role/TrinyxStagingDeployRole
          test "$BASELINE_RELEASE_ID" != "$CANDIDATE_RELEASE_ID"
      - name: Download and verify exact baseline and candidate artifact ZIPs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BASELINE_ARTIFACT_ID: ${{ inputs.baseline_artifact_id }}
          BASELINE_RUN_ID: ${{ inputs.baseline_run_id }}
          BASELINE_ARTIFACT_DIGEST: ${{ inputs.baseline_artifact_digest }}
          CANDIDATE_ARTIFACT_ID: ${{ inputs.candidate_artifact_id }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_ARTIFACT_DIGEST: ${{ inputs.candidate_artifact_digest }}
          CANDIDATE_SOURCE_COMMIT: ${{ inputs.candidate_source_commit }}
          BASELINE_SOURCE_COMMIT: ${{ inputs.baseline_source_commit }}
        run: |
          set -euo pipefail
          umask 077
          mkdir artifacts
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$BASELINE_ARTIFACT_ID" > artifacts/baseline-metadata.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BASELINE_RUN_ID" > artifacts/baseline-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$CANDIDATE_ARTIFACT_ID" > artifacts/candidate-metadata.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID" > artifacts/candidate-run.json
          python3 - <<'PY'
          # BEGIN STAGING_QUALIFICATION_RUN_PROVENANCE_VALIDATION
          import datetime as dt
          import json
          import os
          import re
          from pathlib import Path

          REPOSITORY = "TrinyxAI/Trinyx"
          REPOSITORY_ID = "1342032975"
          OWNER_ID = "319253481"
          CALLER_REF = "refs/heads/codex/platform-release-automation"
          BUILDER_COMMIT = "114a2613e8090f034925a1bcf148f055653c3a06"
          FROZEN_SOURCE = "f3a4c1ddcf6a17bfc837071f9046ac4c38a38b47"
          AEB2_SOURCE = "aeb2a447ea7ce0436a60549713636225dfe1a2c1"
          AEB2_CALLER_HEAD = "b883685a513795e6224f4166fef65a72bc120a87"
          AEB2_BUILDER = "22f1e593c36eaf1d70197db91bd54e31844a7eef"
          UTC_RFC3339 = re.compile(
              r"[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(?:[.][0-9]{1,6})?Z"
          )
          FROZEN_IDENTITY = {
              "GITHUB_REPOSITORY": REPOSITORY,
              "GITHUB_REPOSITORY_ID": REPOSITORY_ID,
              "GITHUB_REPOSITORY_OWNER_ID": OWNER_ID,
              "RUN_ID": "33485509832",
              "ARTIFACT_ID": "9791964215",
              "ARTIFACT_DIGEST": "sha256:755594078d9da7e19406e01187534132920a31f87804c1b33baa28fa96559152",
              "SOURCE_COMMIT": FROZEN_SOURCE,
              "RELEASE_ID": "rel-v1-b5ba70c23b9f529ac8228a7b00b4faa4",
              "BUNDLE_DIGEST": "sha256:c9df14dcd1dbc24b31b926d3778bef2e208b59824c78f24292608284f3579892",
          }
          APPROVED_BASELINE_IDENTITY = {
              "GITHUB_REPOSITORY": REPOSITORY,
              "GITHUB_REPOSITORY_ID": REPOSITORY_ID,
              "GITHUB_REPOSITORY_OWNER_ID": OWNER_ID,
              "RUN_ID": "33858423626",
              "ARTIFACT_ID": "9931132603",
              "ARTIFACT_DIGEST": "sha256:76fa8c2765f08f2f502d43e497e7da4a104e134e9d35ad7be661224aa8adde2a",
              "SOURCE_COMMIT": AEB2_SOURCE,
              "RELEASE_ID": "rel-v1-61d902b8c3f36f7b23873cab31427243",
              "BUNDLE_DIGEST": "sha256:178805ec9d47a8624d1476ec3859959b9033f2893f0473051d9c9c3d2b9c0047",
          }

          def identity(prefix):
              return {
                  "GITHUB_REPOSITORY": os.environ["GITHUB_REPOSITORY"],
                  "GITHUB_REPOSITORY_ID": os.environ["GITHUB_REPOSITORY_ID"],
                  "GITHUB_REPOSITORY_OWNER_ID": os.environ["GITHUB_REPOSITORY_OWNER_ID"],
                  "RUN_ID": os.environ[f"{prefix}_RUN_ID"],
                  "ARTIFACT_ID": os.environ[f"{prefix}_ARTIFACT_ID"],
                  "ARTIFACT_DIGEST": os.environ[f"{prefix}_ARTIFACT_DIGEST"],
                  "SOURCE_COMMIT": os.environ[f"{prefix}_SOURCE_COMMIT"],
                  "RELEASE_ID": os.environ[f"{prefix}_RELEASE_ID"],
                  "BUNDLE_DIGEST": os.environ[f"{prefix}_BUNDLE_DIGEST"],
              }

          def verified_created_at(run, name):
              value = run.get("created_at")
              if not isinstance(value, str) or UTC_RFC3339.fullmatch(value) is None:
                  raise SystemExit(f"invalid verified build run created_at:{name}")
              try:
                  parsed = dt.datetime.fromisoformat(value[:-1] + "+00:00")
              except ValueError as exc:
                  raise SystemExit(f"invalid verified build run created_at:{name}") from exc
              if parsed.tzinfo != dt.timezone.utc:
                  raise SystemExit(f"verified build run created_at is not UTC:{name}")
              return value

          for name in ("baseline", "candidate"):
              prefix = name.upper()
              artifact = json.load(open(f"artifacts/{name}-metadata.json", encoding="utf-8"))
              run = json.load(open(f"artifacts/{name}-run.json", encoding="utf-8"))
              current = identity(prefix)
              frozen = current == FROZEN_IDENTITY
              approved_baseline = name == "baseline" and current == APPROVED_BASELINE_IDENTITY

              if str(artifact.get("id")) != current["ARTIFACT_ID"]:
                  raise SystemExit(f"artifact id mismatch:{name}")
              expected_artifact_name = (
                  "trinyx-historical-staging-baseline-" + AEB2_SOURCE
                  if approved_baseline
                  else "trinyx-release-candidate-" + current["SOURCE_COMMIT"]
              )
              if artifact.get("name") != expected_artifact_name:
                  raise SystemExit(f"artifact name mismatch:{name}")
              if artifact.get("expired") is not False:
                  raise SystemExit(f"artifact expired:{name}")
              workflow_run = artifact.get("workflow_run")
              if not isinstance(workflow_run, dict):
                  raise SystemExit(f"artifact workflow run missing:{name}")
              if str(workflow_run.get("id")) != current["RUN_ID"]:
                  raise SystemExit(f"artifact/run mismatch:{name}")
              expected_run_head = AEB2_CALLER_HEAD if approved_baseline else current["SOURCE_COMMIT"]
              if workflow_run.get("head_sha") != expected_run_head:
                  raise SystemExit(f"artifact/source mismatch:{name}")
              if approved_baseline:
                  if artifact.get("digest") != current["ARTIFACT_DIGEST"]:
                      raise SystemExit(f"artifact digest mismatch:{name}")
                  if (
                      workflow_run.get("head_branch") != "main"
                      or str(workflow_run.get("repository_id")) != REPOSITORY_ID
                      or str(workflow_run.get("head_repository_id")) != REPOSITORY_ID
                  ):
                      raise SystemExit(f"historical baseline artifact provenance mismatch:{name}")

              if run.get("id") != int(current["RUN_ID"]):
                  raise SystemExit(f"run id mismatch:{name}")
              if run.get("head_sha") != expected_run_head:
                  raise SystemExit(f"run source mismatch:{name}")
              if run.get("conclusion") != "success":
                  raise SystemExit(f"run conclusion mismatch:{name}")
              repository = run.get("repository")
              head_repository = run.get("head_repository")
              if (
                  not isinstance(repository, dict)
                  or repository.get("full_name") != REPOSITORY
                  or str(repository.get("id")) != REPOSITORY_ID
                  or not isinstance(repository.get("owner"), dict)
                  or str(repository["owner"].get("id")) != OWNER_ID
                  or not isinstance(head_repository, dict)
                  or head_repository.get("full_name") != REPOSITORY
                  or str(head_repository.get("id")) != REPOSITORY_ID
              ):
                  raise SystemExit(f"run repository mismatch:{name}")

              referenced = run.get("referenced_workflows")
              if not isinstance(referenced, list):
                  raise SystemExit(f"referenced workflows missing:{name}")
              if approved_baseline:
                  if (
                      run.get("path") != ".github/workflows/build-historical-staging-baseline.yml"
                      or run.get("event") != "workflow_dispatch"
                      or run.get("head_branch") != "main"
                      or run.get("run_attempt") != 1
                  ):
                      raise SystemExit(f"historical baseline caller mismatch:{name}")
                  expected = [{
                      "path": (
                          f"{REPOSITORY}/.github/workflows/"
                          f"build-historical-staging-baseline-impl.yml@{AEB2_BUILDER}"
                      ),
                      "sha": AEB2_BUILDER,
                  }]
                  if referenced != expected:
                      raise SystemExit(f"historical baseline builder mismatch:{name}")
              else:
                  if frozen:
                      if run.get("path") != ".github/workflows/build-trinyx-backend.yml":
                          raise SystemExit(f"historical caller mismatch:{name}")
                      expected_sha = FROZEN_SOURCE
                      expected_path = (
                          f"{REPOSITORY}/.github/workflows/"
                          f"build-release-candidate.yml@{FROZEN_SOURCE}"
                      )
                  else:
                      if run.get("path") not in {
                          ".github/workflows/build-trinyx-backend.yml",
                          ".github/workflows/build-release-candidate.yml",
                      }:
                          raise SystemExit(f"modern caller mismatch:{name}")
                      expected_sha = os.environ["BUILDER_WORKFLOW_COMMIT"]
                      if expected_sha != BUILDER_COMMIT:
                          raise SystemExit("builder commit mismatch")
                      expected_path = (
                          f"{REPOSITORY}/.github/workflows/"
                          f"build-release-candidate-impl.yml@{expected_sha}"
                      )
                  matches = [item for item in referenced if item.get("path") == expected_path]
                  if len(matches) != 1 or matches[0].get("sha") != expected_sha:
                      raise SystemExit(f"builder provenance mismatch:{name}")
                  if frozen:
                      if matches[0].get("ref") != CALLER_REF:
                          raise SystemExit(f"historical builder ref mismatch:{name}")
                  elif matches[0].get("ref") is not None:
                      raise SystemExit(f"SHA-pinned builder unexpectedly has ref:{name}")

              Path(f"artifacts/{name}-verified-build-created-at.txt").write_text(
                  verified_created_at(run, name) + "\n",
                  encoding="utf-8",
              )
          # END STAGING_QUALIFICATION_RUN_PROVENANCE_VALIDATION
          PY
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$BASELINE_ARTIFACT_ID/zip" > artifacts/baseline.zip
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$CANDIDATE_ARTIFACT_ID/zip" > artifacts/candidate.zip
          printf '%s  artifacts/baseline.zip\n' "${BASELINE_ARTIFACT_DIGEST#sha256:}" | sha256sum -c --strict
          printf '%s  artifacts/candidate.zip\n' "${CANDIDATE_ARTIFACT_DIGEST#sha256:}" | sha256sum -c --strict
      - name: Attest the exact qualification inputs
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2, Node 24
        with:
          subject-path: artifacts/*.zip
      - name: Verify provenance contracts and meaningful runtime difference
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BASELINE_ARTIFACT_ID: ${{ inputs.baseline_artifact_id }}
          BASELINE_RUN_ID: ${{ inputs.baseline_run_id }}
          BASELINE_ARTIFACT_DIGEST: ${{ inputs.baseline_artifact_digest }}
          BASELINE_RELEASE_ID: ${{ inputs.baseline_release_id }}
          BASELINE_BUNDLE_DIGEST: ${{ inputs.baseline_bundle_digest }}
          CANDIDATE_ARTIFACT_ID: ${{ inputs.candidate_artifact_id }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_ARTIFACT_DIGEST: ${{ inputs.candidate_artifact_digest }}
          CANDIDATE_RELEASE_ID: ${{ inputs.candidate_release_id }}
          CANDIDATE_BUNDLE_DIGEST: ${{ inputs.candidate_bundle_digest }}
          CANDIDATE_SOURCE_COMMIT: ${{ inputs.candidate_source_commit }}
          BASELINE_SOURCE_COMMIT: ${{ inputs.baseline_source_commit }}
        run: |
          set -euo pipefail
          gh attestation verify artifacts/baseline.zip --repo "$GITHUB_REPOSITORY"
          gh attestation verify artifacts/candidate.zip --repo "$GITHUB_REPOSITORY"
          mkdir baseline candidate
          unzip -q artifacts/baseline.zip -d baseline
          unzip -q artifacts/candidate.zip -d candidate
          python3 - <<'PY'
          # BEGIN STAGING_QUALIFICATION_ATTESTATION_COMPATIBILITY
          import hashlib
          import hmac
          import json
          import os
          from pathlib import Path

          FROZEN_IDENTITY = {
              "GITHUB_REPOSITORY": "TrinyxAI/Trinyx",
              "GITHUB_REPOSITORY_ID": "1342032975",
              "GITHUB_REPOSITORY_OWNER_ID": "319253481",
              "RUN_ID": "33485509832",
              "ARTIFACT_ID": "9791964215",
              "ARTIFACT_DIGEST": "sha256:755594078d9da7e19406e01187534132920a31f87804c1b33baa28fa96559152",
              "SOURCE_COMMIT": "f3a4c1ddcf6a17bfc837071f9046ac4c38a38b47",
              "RELEASE_ID": "rel-v1-b5ba70c23b9f529ac8228a7b00b4faa4",
              "BUNDLE_DIGEST": "sha256:c9df14dcd1dbc24b31b926d3778bef2e208b59824c78f24292608284f3579892",
          }
          APPROVED_BASELINE_IDENTITY = {
              "GITHUB_REPOSITORY": "TrinyxAI/Trinyx",
              "GITHUB_REPOSITORY_ID": "1342032975",
              "GITHUB_REPOSITORY_OWNER_ID": "319253481",
              "RUN_ID": "33858423626",
              "ARTIFACT_ID": "9931132603",
              "ARTIFACT_DIGEST": "sha256:76fa8c2765f08f2f502d43e497e7da4a104e134e9d35ad7be661224aa8adde2a",
              "SOURCE_COMMIT": "aeb2a447ea7ce0436a60549713636225dfe1a2c1",
              "RELEASE_ID": "rel-v1-61d902b8c3f36f7b23873cab31427243",
              "BUNDLE_DIGEST": "sha256:178805ec9d47a8624d1476ec3859959b9033f2893f0473051d9c9c3d2b9c0047",
          }
          FROZEN_INTERNAL_SHA256 = {
              "release.json": "ad5a5b702d9659e0af5d5b82a422953ba2390a94396949f897757568c9b59789",
              "release-images.json": "fe1134c3920af0f2f9f0027082f25ec5adb1cbb6d41a1053bada7ef730f66a8a",
              "deployment-bundle.json": "b101918414ee9d113d4ef54d32c9f438005d8ebee7bde2e62f72d58a16cfdd7b",
              "deployment-bundle.tar": "c9df14dcd1dbc24b31b926d3778bef2e208b59824c78f24292608284f3579892",
          }

          def identity(env, prefix):
              return {
                  "GITHUB_REPOSITORY": env["GITHUB_REPOSITORY"],
                  "GITHUB_REPOSITORY_ID": env["GITHUB_REPOSITORY_ID"],
                  "GITHUB_REPOSITORY_OWNER_ID": env["GITHUB_REPOSITORY_OWNER_ID"],
                  "RUN_ID": env[f"{prefix}_RUN_ID"],
                  "ARTIFACT_ID": env[f"{prefix}_ARTIFACT_ID"],
                  "ARTIFACT_DIGEST": env[f"{prefix}_ARTIFACT_DIGEST"],
                  "SOURCE_COMMIT": env[f"{prefix}_SOURCE_COMMIT"],
                  "RELEASE_ID": env[f"{prefix}_RELEASE_ID"],
                  "BUNDLE_DIGEST": env[f"{prefix}_BUNDLE_DIGEST"],
              }

          def file_sha256(path):
              digest = hashlib.sha256()
              with path.open("rb") as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest()

          def resolve_attestation_policy(env, directory, prefix):
              current = identity(env, prefix)
              release = json.loads((directory / "release.json").read_text(encoding="utf-8"))
              if (
                  release.get("releaseId") != current["RELEASE_ID"]
                  or release.get("sourceCommit") != current["SOURCE_COMMIT"]
                  or release.get("deploymentBundle", {}).get("digest") != current["BUNDLE_DIGEST"]
              ):
                  raise SystemExit(f"release/input identity mismatch:{directory.name}")
              if current == FROZEN_IDENTITY:
                  for name, expected in FROZEN_INTERNAL_SHA256.items():
                      actual = file_sha256(directory / name)
                      if not hmac.compare_digest(actual, expected):
                          raise SystemExit(
                              f"historical candidate internal digest mismatch:{directory.name}:{name}"
                          )
                  return {
                      "SIGNER_WORKFLOW": "build-release-candidate.yml",
                      "SIGNER_DIGEST": FROZEN_IDENTITY["SOURCE_COMMIT"],
                      "ATTESTATION_SOURCE_DIGEST": FROZEN_IDENTITY["SOURCE_COMMIT"],
                      "COMPATIBILITY": "frozen-historical-builder",
                      "REQUIRE_INTERNAL_ATTESTATIONS": "false",
                  }
              if prefix == "BASELINE" and current == APPROVED_BASELINE_IDENTITY:
                  return {
                      "SIGNER_WORKFLOW": "build-historical-staging-baseline-impl.yml",
                      "SIGNER_DIGEST": "22f1e593c36eaf1d70197db91bd54e31844a7eef",
                      "ATTESTATION_SOURCE_DIGEST": "b883685a513795e6224f4166fef65a72bc120a87",
                      "COMPATIBILITY": "pinned-reusable-builder",
                      "REQUIRE_INTERNAL_ATTESTATIONS": "true",
                  }
              return {
                  "SIGNER_WORKFLOW": "build-release-candidate-impl.yml",
                  "SIGNER_DIGEST": env["BUILDER_WORKFLOW_COMMIT"],
                  "ATTESTATION_SOURCE_DIGEST": current["SOURCE_COMMIT"],
                  "COMPATIBILITY": "pinned-reusable-builder",
                  "REQUIRE_INTERNAL_ATTESTATIONS": "true",
              }

          def main():
              for name in ("baseline", "candidate"):
                  policy = resolve_attestation_policy(os.environ, Path(name), name.upper())
                  target = Path(f"{name}-attestation-policy.env")
                  target.write_text(
                      "".join(f"{key}={value}\n" for key, value in policy.items()),
                      encoding="utf-8",
                  )
                  target.chmod(0o600)

          if __name__ == "__main__":
              main()
          # END STAGING_QUALIFICATION_ATTESTATION_COMPATIBILITY
          PY
          # BEGIN STAGING_QUALIFICATION_INTERNAL_ATTESTATION_VERIFICATION
          for name in baseline candidate; do
            upper=\${name^^}
