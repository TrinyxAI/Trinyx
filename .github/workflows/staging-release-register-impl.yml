name: Register Staging Release Implementation

on:
  workflow_call:
    inputs:
      run_id:
        description: GitHub Actions build workflow run ID
        required: true
        default: '33485509832'
        type: string
      artifact_id:
        description: GitHub Actions artifact ID
        required: true
        default: '9791964215'
        type: string
      artifact_digest:
        description: GitHub artifact ZIP digest
        required: true
        default: 'sha256:755594078d9da7e19406e01187534132920a31f87804c1b33baa28fa96559152'
        type: string
      source_commit:
        description: Frozen application source commit
        required: true
        default: 'f3a4c1ddcf6a17bfc837071f9046ac4c38a38b47'
        type: string
      release_id:
        description: Expected frozen release ID
        required: true
        default: 'rel-v1-b5ba70c23b9f529ac8228a7b00b4faa4'
        type: string
      bundle_digest:
        description: Expected deployment bundle digest
        required: true
        default: 'sha256:c9df14dcd1dbc24b31b926d3778bef2e208b59824c78f24292608284f3579892'
        type: string
      registry_bucket:
        description: Approved ReleaseRegistryBucketName stack output
        required: true
        type: string
      publisher_role_arn:
        description: Approved ReleasePublisherRoleArn stack output
        required: true
        type: string

permissions:
  actions: read
  attestations: write
  contents: read
  id-token: write

concurrency:
  group: trinyx-staging-release-registration
  cancel-in-progress: false

jobs:
  register:
    if: github.ref == 'refs/heads/codex/platform-release-automation'
    environment: staging
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CONTROL_PLANE_COMMIT: e160e3e1c12995ad522a936c95061e03c174f8d8
      BUILDER_WORKFLOW_COMMIT: 114a2613e8090f034925a1bcf148f055653c3a06
    steps:
      - name: Checkout reviewed platform commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          ref: e160e3e1c12995ad522a936c95061e03c174f8d8
          persist-credentials: false
      - name: Verify immutable control-plane checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CONTROL_PLANE_COMMIT"
      - name: Validate immutable identities
        shell: bash
        env:
          ARTIFACT_ID: ${{ inputs.artifact_id }}
          RUN_ID: ${{ inputs.run_id }}
          ARTIFACT_DIGEST: ${{ inputs.artifact_digest }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          RELEASE_ID: ${{ inputs.release_id }}
          BUNDLE_DIGEST: ${{ inputs.bundle_digest }}
          REGISTRY_BUCKET: ${{ inputs.registry_bucket }}
          PUBLISHER_ROLE_ARN: ${{ inputs.publisher_role_arn }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = TrinyxAI/Trinyx
          test "$GITHUB_REPOSITORY_ID" = 1342032975
          test "$GITHUB_REPOSITORY_OWNER_ID" = 319253481
          [[ "$ARTIFACT_ID" =~ ^[0-9]+$ ]]
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE_ID" =~ ^rel-v1-[0-9a-f]{32}$ ]]
          [[ "$BUNDLE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$REGISTRY_BUCKET" =~ ^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$ ]]
          [[ "$PUBLISHER_ROLE_ARN" =~ ^arn:aws:iam::001634075617:role/TrinyxStagingReleasePublisherRole$ ]]
      - name: Download exact existing artifact and verify GitHub ZIP digest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ inputs.artifact_id }}
          RUN_ID: ${{ inputs.run_id }}
          ARTIFACT_DIGEST: ${{ inputs.artifact_digest }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          RELEASE_ID: ${{ inputs.release_id }}
          BUNDLE_DIGEST: ${{ inputs.bundle_digest }}
        run: |
          set -euo pipefail
          umask 077
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" > artifact-metadata.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" > run-metadata.json
          python3 - <<'PY'
          # BEGIN STAGING_RELEASE_RUN_PROVENANCE_VALIDATION
          import json
          import os

          artifact = json.load(open("artifact-metadata.json", encoding="utf-8"))
          run = json.load(open("run-metadata.json", encoding="utf-8"))

          repository = "TrinyxAI/Trinyx"
          caller_ref = "refs/heads/codex/platform-release-automation"
          historical_source = "f3a4c1ddcf6a17bfc837071f9046ac4c38a38b47"
          historical_inputs = {
              "ARTIFACT_ID": "9791964215",
              "RUN_ID": "33485509832",
              "ARTIFACT_DIGEST": "sha256:755594078d9da7e19406e01187534132920a31f87804c1b33baa28fa96559152",
              "SOURCE_COMMIT": historical_source,
              "RELEASE_ID": "rel-v1-b5ba70c23b9f529ac8228a7b00b4faa4",
              "BUNDLE_DIGEST": "sha256:c9df14dcd1dbc24b31b926d3778bef2e208b59824c78f24292608284f3579892",
          }
          is_historical = all(os.environ.get(key) == value for key, value in historical_inputs.items())

          assert str(artifact["id"]) == os.environ["ARTIFACT_ID"]
          assert artifact["name"] == "trinyx-release-candidate-" + os.environ["SOURCE_COMMIT"]
          assert artifact["expired"] is False
          assert str(artifact["workflow_run"]["id"]) == os.environ["RUN_ID"]
          assert artifact["workflow_run"]["head_sha"] == os.environ["SOURCE_COMMIT"]
          assert run["id"] == int(os.environ["RUN_ID"])
          assert run["head_sha"] == os.environ["SOURCE_COMMIT"]
          assert run["conclusion"] == "success"
          assert run["repository"]["full_name"] == repository

          referenced = run.get("referenced_workflows")
          assert isinstance(referenced, list)
          if is_historical:
              assert run["path"] == ".github/workflows/build-trinyx-backend.yml"
              expected_sha = historical_source
              expected_path = (
                  f"{repository}/.github/workflows/build-release-candidate.yml@{historical_source}"
              )
          else:
              assert run["path"] in {
                  ".github/workflows/build-trinyx-backend.yml",
                  ".github/workflows/build-release-candidate.yml",
              }
              expected_sha = os.environ["BUILDER_WORKFLOW_COMMIT"]
              assert expected_sha == "114a2613e8090f034925a1bcf148f055653c3a06"
              expected_path = (
                  f"{repository}/.github/workflows/build-release-candidate-impl.yml@{expected_sha}"
              )

          matches = [item for item in referenced if item.get("path") == expected_path]
          assert len(matches) == 1
          assert matches[0].get("sha") == expected_sha
          if is_historical:
              assert matches[0].get("ref") == caller_ref
          else:
              # GitHub omits ref when a reusable workflow is invoked by immutable SHA.
              assert matches[0].get("ref") is None
          # END STAGING_RELEASE_RUN_PROVENANCE_VALIDATION
          PY
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > candidate.zip
          printf '%s  %s\n' "${ARTIFACT_DIGEST#sha256:}" candidate.zip | sha256sum --check --strict
      - name: Attest the exact downloaded GitHub artifact
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2, Node 24
        with:
          subject-path: candidate.zip
      - name: Verify attestation and release contracts before AWS credentials
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ inputs.artifact_id }}
          RUN_ID: ${{ inputs.run_id }}
          ARTIFACT_DIGEST: ${{ inputs.artifact_digest }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          RELEASE_ID: ${{ inputs.release_id }}
          BUNDLE_DIGEST: ${{ inputs.bundle_digest }}
        run: |
          set -euo pipefail
          gh attestation verify candidate.zip --repo "$GITHUB_REPOSITORY"
          mkdir candidate
          unzip -q candidate.zip -d candidate
          python3 - <<'PY'
          # BEGIN STAGING_RELEASE_ATTESTATION_COMPATIBILITY
          import hashlib
          import hmac
          import os
          from pathlib import Path

          HISTORICAL_IDENTITY = {
              "GITHUB_REPOSITORY": "TrinyxAI/Trinyx",
              "GITHUB_REPOSITORY_ID": "1342032975",
              "GITHUB_REPOSITORY_OWNER_ID": "319253481",
              "RUN_ID": "33485509832",
              "ARTIFACT_ID": "9791964215",
              "ARTIFACT_DIGEST": "sha256:755594078d9da7e19406e01187534132920a31f87804c1b33baa28fa96559152",
              "SOURCE_COMMIT": "f3a4c1ddcf6a17bfc837071f9046ac4c38a38b47",
              "RELEASE_ID": "rel-v1-b5ba70c23b9f529ac8228a7b00b4faa4",
              "BUNDLE_DIGEST": "sha256:c9df14dcd1dbc24b31b926d3778bef2e208b59824c78f24292608284f3579892",
          }
          HISTORICAL_INTERNAL_SHA256 = {
              "release.json": "ad5a5b702d9659e0af5d5b82a422953ba2390a94396949f897757568c9b59789",
              "release-images.json": "fe1134c3920af0f2f9f0027082f25ec5adb1cbb6d41a1053bada7ef730f66a8a",
              "deployment-bundle.json": "b101918414ee9d113d4ef54d32c9f438005d8ebee7bde2e62f72d58a16cfdd7b",
              "deployment-bundle.tar": "c9df14dcd1dbc24b31b926d3778bef2e208b59824c78f24292608284f3579892",
          }

          def is_frozen_historical_candidate(env):
              return all(env.get(key) == value for key, value in HISTORICAL_IDENTITY.items())

          def file_sha256(path):
              digest = hashlib.sha256()
              with path.open("rb") as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest()

          def resolve_attestation_policy(env, candidate):
              if is_frozen_historical_candidate(env):
                  for name, expected in HISTORICAL_INTERNAL_SHA256.items():
                      actual = file_sha256(candidate / name)
                      if not hmac.compare_digest(actual, expected):
                          raise SystemExit(
                              f"historical candidate internal digest mismatch:{name}"
                          )
                  return {
                      "SIGNER_WORKFLOW": "build-release-candidate.yml",
                      "SIGNER_DIGEST": HISTORICAL_IDENTITY["SOURCE_COMMIT"],
                      "COMPATIBILITY": "frozen-historical-builder",
                      "REQUIRE_INTERNAL_ATTESTATIONS": "false",
                  }
              return {
                  "SIGNER_WORKFLOW": "build-release-candidate-impl.yml",
                  "SIGNER_DIGEST": env["BUILDER_WORKFLOW_COMMIT"],
                  "COMPATIBILITY": "pinned-reusable-builder",
                  "REQUIRE_INTERNAL_ATTESTATIONS": "true",
              }

          def main():
              policy = resolve_attestation_policy(os.environ, Path("candidate"))
              output = "".join(f"{key}={value}\n" for key, value in policy.items())
              target = Path("attestation-policy.env")
              target.write_text(output, encoding="utf-8")
              target.chmod(0o600)

          if __name__ == "__main__":
              main()
          # END STAGING_RELEASE_ATTESTATION_COMPATIBILITY
          PY
          source attestation-policy.env
          export SIGNER_WORKFLOW SIGNER_DIGEST COMPATIBILITY
          # BEGIN STAGING_RELEASE_INTERNAL_ATTESTATION_VERIFICATION
          case "$REQUIRE_INTERNAL_ATTESTATIONS" in
            true)
              for subject in release.json release-images.json deployment-bundle.json deployment-bundle.tar; do
                gh attestation verify "candidate/$subject" \
                  --repo "$GITHUB_REPOSITORY" \
                  --signer-workflow "TrinyxAI/Trinyx/.github/workflows/$SIGNER_WORKFLOW" \
                  --signer-digest "$SIGNER_DIGEST" \
                  --source-digest "$SOURCE_COMMIT" \
                  --deny-self-hosted-runners
              done
              ;;
            false)
              if [[ "$COMPATIBILITY" != frozen-historical-builder ]]; then
                echo "ERROR_INVALID_ATTESTATION_POLICY" >&2
                exit 1
              fi
              ;;
            *)
              echo "ERROR_INVALID_ATTESTATION_POLICY" >&2
              exit 1
              ;;
          esac
          # END STAGING_RELEASE_INTERNAL_ATTESTATION_VERIFICATION
          python3 - <<'PY'
          import datetime, json, os
          from pathlib import Path
          candidate=Path('candidate')
          release=json.loads((candidate/'release.json').read_text())
          assert release['releaseId']==os.environ['RELEASE_ID']
          assert release['sourceCommit']==os.environ['SOURCE_COMMIT']
          assert release['deploymentBundle']['digest']==os.environ['BUNDLE_DIGEST']
          assert release['deploymentBundle']['fileCount']==13
          (candidate/'provenance.json').write_text(json.dumps({
            'schemaVersion':2,'repository':'TrinyxAI/Trinyx',
            'signerWorkflow':os.environ['SIGNER_WORKFLOW'],'signerDigest':os.environ['SIGNER_DIGEST'],
            'compatibility':os.environ['COMPATIBILITY'],
            'sourceCommit':release['sourceCommit'],'artifactId':os.environ['ARTIFACT_ID'],'runId':os.environ['RUN_ID'],
            'artifactDigest':os.environ['ARTIFACT_DIGEST'],
            'verifiedAt':datetime.datetime.now(datetime.timezone.utc).isoformat().replace('+00:00','Z')
          },sort_keys=True,separators=(',',':'))+'\n')
          PY
          python3 platform/automation/release_registry.py --help >/dev/null
          PYTHONPATH=platform python3 -c "from pathlib import Path; from automation.release_registry import validate_candidate; validate_candidate(Path('candidate'))"
      - name: Assume publisher-only AWS role
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4, Node 24
        with:
          role-to-assume: ${{ inputs.publisher_role_arn }}
          aws-region: us-east-1
          role-session-name: trinyx-staging-publish-${{ github.run_id }}
      - name: Conditionally register immutable release
        env:
          REGISTRY_BUCKET: ${{ inputs.registry_bucket }}
        run: python3 platform/automation/release_registry.py register --bucket "$REGISTRY_BUCKET" --candidate-dir candidate
