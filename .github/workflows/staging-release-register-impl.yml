name: Register Staging Release Implementation

on:
  workflow_call:
    inputs:
      run_id:
        description: GitHub Actions build workflow run ID
        required: true
        default: '33485509832'
        type: string
      artifact_id:
        description: GitHub Actions artifact ID
        required: true
        default: '9791964215'
        type: string
      artifact_digest:
        description: GitHub artifact ZIP digest
        required: true
        default: 'sha256:755594078d9da7e19406e01187534132920a31f87804c1b33baa28fa96559152'
        type: string
      source_commit:
        description: Frozen application source commit
        required: true
        default: 'f3a4c1ddcf6a17bfc837071f9046ac4c38a38b47'
        type: string
      release_id:
        description: Expected frozen release ID
        required: true
        default: 'rel-v1-b5ba70c23b9f529ac8228a7b00b4faa4'
        type: string
      bundle_digest:
        description: Expected deployment bundle digest
        required: true
        default: 'sha256:c9df14dcd1dbc24b31b926d3778bef2e208b59824c78f24292608284f3579892'
        type: string
      registry_bucket:
        description: Approved ReleaseRegistryBucketName stack output
        required: true
        type: string
      publisher_role_arn:
        description: Approved ReleasePublisherRoleArn stack output
        required: true
        type: string

permissions:
  actions: read
  attestations: write
  contents: read
  id-token: write

concurrency:
  group: trinyx-staging-release-registration
  cancel-in-progress: false

jobs:
  register:
    if: github.ref == 'refs/heads/codex/platform-release-automation'
    environment: staging
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CONTROL_PLANE_COMMIT: ee40526a1891d42cd572bf64326b365f0f68b64f
      BUILDER_WORKFLOW_COMMIT: 114a2613e8090f034925a1bcf148f055653c3a06
    steps:
      - name: Checkout reviewed platform commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          ref: ee40526a1891d42cd572bf64326b365f0f68b64f
          persist-credentials: false
      - name: Verify immutable control-plane checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CONTROL_PLANE_COMMIT"
      - name: Validate immutable identities
        shell: bash
        env:
          ARTIFACT_ID: ${{ inputs.artifact_id }}
          RUN_ID: ${{ inputs.run_id }}
          ARTIFACT_DIGEST: ${{ inputs.artifact_digest }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          RELEASE_ID: ${{ inputs.release_id }}
          BUNDLE_DIGEST: ${{ inputs.bundle_digest }}
          REGISTRY_BUCKET: ${{ inputs.registry_bucket }}
          PUBLISHER_ROLE_ARN: ${{ inputs.publisher_role_arn }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = TrinyxAI/Trinyx
          test "$GITHUB_REPOSITORY_ID" = 1342032975
          test "$GITHUB_REPOSITORY_OWNER_ID" = 319253481
          [[ "$ARTIFACT_ID" =~ ^[0-9]+$ ]]
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE_ID" =~ ^rel-v1-[0-9a-f]{32}$ ]]
          [[ "$BUNDLE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$REGISTRY_BUCKET" =~ ^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$ ]]
          [[ "$PUBLISHER_ROLE_ARN" =~ ^arn:aws:iam::001634075617:role/TrinyxStagingReleasePublisherRole$ ]]
      - name: Download exact existing artifact and verify GitHub ZIP digest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ inputs.artifact_id }}
          RUN_ID: ${{ inputs.run_id }}
          ARTIFACT_DIGEST: ${{ inputs.artifact_digest }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          RELEASE_ID: ${{ inputs.release_id }}
          BUNDLE_DIGEST: ${{ inputs.bundle_digest }}
        run: |
          set -euo pipefail
          umask 077
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" > artifact-metadata.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" > run-metadata.json
          python3 - <<'PY'
          # BEGIN STAGING_RELEASE_RUN_PROVENANCE_VALIDATION
          import datetime as dt
          import json
          import os
          import re
          from pathlib import Path
          
          artifact = json.load(open("artifact-metadata.json", encoding="utf-8"))
          run = json.load(open("run-metadata.json", encoding="utf-8"))
          
          REPOSITORY = "TrinyxAI/Trinyx"
          CALLER_REF = "refs/heads/codex/platform-release-automation"
          FROZEN_SOURCE = "f3a4c1ddcf6a17bfc837071f9046ac4c38a38b47"
          FROZEN_INPUTS = {
              "ARTIFACT_ID": "9791964215",
              "RUN_ID": "33485509832",
              "ARTIFACT_DIGEST": "sha256:755594078d9da7e19406e01187534132920a31f87804c1b33baa28fa96559152",
              "SOURCE_COMMIT": FROZEN_SOURCE,
              "RELEASE_ID": "rel-v1-b5ba70c23b9f529ac8228a7b00b4faa4",
              "BUNDLE_DIGEST": "sha256:c9df14dcd1dbc24b31b926d3778bef2e208b59824c78f24292608284f3579892",
          }
          APPROVED_HISTORICAL_BASELINE_INPUTS = {
              "ARTIFACT_ID": "9931132603",
              "RUN_ID": "33858423626",
              "ARTIFACT_DIGEST": "sha256:76fa8c2765f08f2f502d43e497e7da4a104e134e9d35ad7be661224aa8adde2a",
              "SOURCE_COMMIT": "aeb2a447ea7ce0436a60549713636225dfe1a2c1",
              "RELEASE_ID": "rel-v1-61d902b8c3f36f7b23873cab31427243",
              "BUNDLE_DIGEST": "sha256:178805ec9d47a8624d1476ec3859959b9033f2893f0473051d9c9c3d2b9c0047",
          }
          APPROVED_RUN_HEAD = "b883685a513795e6224f4166fef65a72bc120a87"
          APPROVED_ARTIFACT_NAME = (
              "trinyx-historical-staging-baseline-"
              "aeb2a447ea7ce0436a60549713636225dfe1a2c1"
          )
          APPROVED_BUILDER_COMMIT = "22f1e593c36eaf1d70197db91bd54e31844a7eef"
          APPROVED_CALLER = ".github/workflows/build-historical-staging-baseline.yml"
          APPROVED_REUSABLE = (
              f"{REPOSITORY}/.github/workflows/"
              f"build-historical-staging-baseline-impl.yml@{APPROVED_BUILDER_COMMIT}"
          )
          
          def fail(message):
              raise SystemExit(message)
          
          def exact_repository(value):
              return (
                  isinstance(value, dict)
                  and value.get("full_name") == REPOSITORY
                  and value.get("id") == 1342032975
                  and isinstance(value.get("owner"), dict)
                  and value["owner"].get("id") == 319253481
              )
          
          is_frozen = all(os.environ.get(key) == value for key, value in FROZEN_INPUTS.items())
          is_approved_baseline = all(
              os.environ.get(key) == value
              for key, value in APPROVED_HISTORICAL_BASELINE_INPUTS.items()
          )
          
          if str(artifact.get("id")) != os.environ["ARTIFACT_ID"]:
              fail("artifact id mismatch")
          if artifact.get("expired") is not False:
              fail("artifact is expired")
          if str(artifact.get("workflow_run", {}).get("id")) != os.environ["RUN_ID"]:
              fail("artifact/run mismatch")
          if run.get("id") != int(os.environ["RUN_ID"]):
              fail("run id mismatch")
          if run.get("conclusion") != "success":
              fail("run conclusion mismatch")
          if run.get("repository", {}).get("full_name") != REPOSITORY:
              fail("run repository mismatch")
          
          if is_approved_baseline:
              workflow_run = artifact.get("workflow_run", {})
              if (
                  artifact.get("name") != APPROVED_ARTIFACT_NAME
                  or artifact.get("digest") != os.environ["ARTIFACT_DIGEST"]
                  or workflow_run.get("head_sha") != APPROVED_RUN_HEAD
                  or workflow_run.get("repository_id") != 1342032975
                  or workflow_run.get("head_repository_id") != 1342032975
                  or workflow_run.get("head_branch") != "main"
              ):
                  fail("approved historical baseline artifact mismatch")
              if (
                  run.get("head_sha") != APPROVED_RUN_HEAD
                  or run.get("head_branch") != "main"
                  or run.get("event") != "workflow_dispatch"
                  or run.get("run_attempt") != 1
                  or run.get("path") != APPROVED_CALLER
                  or not exact_repository(run.get("repository"))
                  or not exact_repository(run.get("head_repository"))
              ):
                  fail("approved historical baseline run mismatch")
          else:
              if artifact.get("name") != "trinyx-release-candidate-" + os.environ["SOURCE_COMMIT"]:
                  fail("artifact name mismatch")
              if artifact.get("workflow_run", {}).get("head_sha") != os.environ["SOURCE_COMMIT"]:
                  fail("artifact/source mismatch")
              if run.get("head_sha") != os.environ["SOURCE_COMMIT"]:
                  fail("run source mismatch")
          
          created_at = run.get("created_at")
          if (
              not isinstance(created_at, str)
              or re.fullmatch(
                  r"[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(?:[.][0-9]{1,6})?Z",
                  created_at,
              )
              is None
          ):
              fail("invalid verified build run created_at")
          try:
              parsed_created_at = dt.datetime.fromisoformat(created_at[:-1] + "+00:00")
          except ValueError as exc:
              raise SystemExit("invalid verified build run created_at") from exc
          if parsed_created_at.tzinfo != dt.timezone.utc:
              fail("verified build run created_at is not UTC")
          
          referenced = run.get("referenced_workflows")
          if not isinstance(referenced, list):
              fail("referenced workflows missing")
          if is_approved_baseline:
              expected = [{"path": APPROVED_REUSABLE, "sha": APPROVED_BUILDER_COMMIT}]
              if referenced != expected:
                  fail("approved historical baseline builder provenance mismatch")
          elif is_frozen:
              if run.get("path") != ".github/workflows/build-trinyx-backend.yml":
                  fail("frozen historical caller mismatch")
              expected_sha = FROZEN_SOURCE
              expected_path = (
                  f"{REPOSITORY}/.github/workflows/build-release-candidate.yml@{FROZEN_SOURCE}"
              )
              matches = [item for item in referenced if item.get("path") == expected_path]
              if (
                  len(matches) != 1
                  or matches[0].get("sha") != expected_sha
                  or matches[0].get("ref") != CALLER_REF
              ):
                  fail("frozen historical builder provenance mismatch")
          else:
              if run.get("path") not in {
                  ".github/workflows/build-trinyx-backend.yml",
                  ".github/workflows/build-release-candidate.yml",
              }:
                  fail("modern caller mismatch")
              expected_sha = os.environ["BUILDER_WORKFLOW_COMMIT"]
              if expected_sha != "114a2613e8090f034925a1bcf148f055653c3a06":
                  fail("builder commit mismatch")
              expected_path = (
                  f"{REPOSITORY}/.github/workflows/build-release-candidate-impl.yml@{expected_sha}"
              )
              matches = [item for item in referenced if item.get("path") == expected_path]
              if (
                  len(matches) != 1
                  or matches[0].get("sha") != expected_sha
                  or matches[0].get("ref") is not None
              ):
                  fail("modern builder provenance mismatch")
          
          Path("verified-build-created-at.txt").write_text(
              created_at + "\n", encoding="utf-8"
          )
          # END STAGING_RELEASE_RUN_PROVENANCE_VALIDATION
          PY
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > candidate.zip
          printf '%s  %s\n' "${ARTIFACT_DIGEST#sha256:}" candidate.zip | sha256sum --check --strict
      - name: Attest the exact downloaded GitHub artifact
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2, Node 24
        with:
          subject-path: candidate.zip
      - name: Verify attestation and release contracts before AWS credentials
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ inputs.artifact_id }}
          RUN_ID: ${{ inputs.run_id }}
          ARTIFACT_DIGEST: ${{ inputs.artifact_digest }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          RELEASE_ID: ${{ inputs.release_id }}
          BUNDLE_DIGEST: ${{ inputs.bundle_digest }}
        run: |
          set -euo pipefail
          gh attestation verify candidate.zip --repo "$GITHUB_REPOSITORY"
          mkdir candidate
          unzip -q candidate.zip -d candidate
          python3 - <<'PY'
          # BEGIN STAGING_RELEASE_ATTESTATION_COMPATIBILITY
          import hashlib
          import hmac
          import os
          from pathlib import Path
          
          FROZEN_IDENTITY = {
              "GITHUB_REPOSITORY": "TrinyxAI/Trinyx",
              "GITHUB_REPOSITORY_ID": "1342032975",
              "GITHUB_REPOSITORY_OWNER_ID": "319253481",
              "RUN_ID": "33485509832",
              "ARTIFACT_ID": "9791964215",
              "ARTIFACT_DIGEST": "sha256:755594078d9da7e19406e01187534132920a31f87804c1b33baa28fa96559152",
              "SOURCE_COMMIT": "f3a4c1ddcf6a17bfc837071f9046ac4c38a38b47",
              "RELEASE_ID": "rel-v1-b5ba70c23b9f529ac8228a7b00b4faa4",
              "BUNDLE_DIGEST": "sha256:c9df14dcd1dbc24b31b926d3778bef2e208b59824c78f24292608284f3579892",
          }
          FROZEN_INTERNAL_SHA256 = {
              "release.json": "ad5a5b702d9659e0af5d5b82a422953ba2390a94396949f897757568c9b59789",
              "release-images.json": "fe1134c3920af0f2f9f0027082f25ec5adb1cbb6d41a1053bada7ef730f66a8a",
              "deployment-bundle.json": "b101918414ee9d113d4ef54d32c9f438005d8ebee7bde2e62f72d58a16cfdd7b",
              "deployment-bundle.tar": "c9df14dcd1dbc24b31b926d3778bef2e208b59824c78f24292608284f3579892",
          }
          APPROVED_HISTORICAL_BASELINE_IDENTITY = {
              "GITHUB_REPOSITORY": "TrinyxAI/Trinyx",
              "GITHUB_REPOSITORY_ID": "1342032975",
              "GITHUB_REPOSITORY_OWNER_ID": "319253481",
              "RUN_ID": "33858423626",
              "ARTIFACT_ID": "9931132603",
              "ARTIFACT_DIGEST": "sha256:76fa8c2765f08f2f502d43e497e7da4a104e134e9d35ad7be661224aa8adde2a",
              "SOURCE_COMMIT": "aeb2a447ea7ce0436a60549713636225dfe1a2c1",
              "RELEASE_ID": "rel-v1-61d902b8c3f36f7b23873cab31427243",
              "BUNDLE_DIGEST": "sha256:178805ec9d47a8624d1476ec3859959b9033f2893f0473051d9c9c3d2b9c0047",
          }
          APPROVED_BASELINE_BUILDER_COMMIT = "22f1e593c36eaf1d70197db91bd54e31844a7eef"
          APPROVED_BASELINE_SOURCE_DIGEST = "b883685a513795e6224f4166fef65a72bc120a87"
          
          def exact_identity(env, expected):
              return all(env.get(key) == value for key, value in expected.items())
          
          def file_sha256(path):
              digest = hashlib.sha256()
              with path.open("rb") as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest()
          
          def resolve_attestation_policy(env, candidate):
              if exact_identity(env, FROZEN_IDENTITY):
                  for name, expected in FROZEN_INTERNAL_SHA256.items():
                      actual = file_sha256(candidate / name)
                      if not hmac.compare_digest(actual, expected):
                          raise SystemExit(
                              f"historical candidate internal digest mismatch:{name}"
                          )
                  return {
                      "SIGNER_WORKFLOW": "build-release-candidate.yml",
                      "SIGNER_DIGEST": FROZEN_IDENTITY["SOURCE_COMMIT"],
                      "ATTESTATION_SOURCE_DIGEST": FROZEN_IDENTITY["SOURCE_COMMIT"],
                      "COMPATIBILITY": "frozen-historical-builder",
                      "REQUIRE_INTERNAL_ATTESTATIONS": "false",
                  }
              if exact_identity(env, APPROVED_HISTORICAL_BASELINE_IDENTITY):
                  return {
                      "SIGNER_WORKFLOW": "build-historical-staging-baseline-impl.yml",
                      "SIGNER_DIGEST": APPROVED_BASELINE_BUILDER_COMMIT,
                      "ATTESTATION_SOURCE_DIGEST": APPROVED_BASELINE_SOURCE_DIGEST,
                      "COMPATIBILITY": "pinned-reusable-builder",
                      "REQUIRE_INTERNAL_ATTESTATIONS": "true",
                  }
              return {
                  "SIGNER_WORKFLOW": "build-release-candidate-impl.yml",
                  "SIGNER_DIGEST": env["BUILDER_WORKFLOW_COMMIT"],
                  "ATTESTATION_SOURCE_DIGEST": env["SOURCE_COMMIT"],
                  "COMPATIBILITY": "pinned-reusable-builder",
                  "REQUIRE_INTERNAL_ATTESTATIONS": "true",
              }
          
          def main():
              policy = resolve_attestation_policy(os.environ, Path("candidate"))
              output = "".join(f"{key}={value}\n" for key, value in policy.items())
              target = Path("attestation-policy.env")
              target.write_text(output, encoding="utf-8")
              target.chmod(0o600)
          
          if __name__ == "__main__":
              main()
          # END STAGING_RELEASE_ATTESTATION_COMPATIBILITY
          PY
          source attestation-policy.env
          export SIGNER_WORKFLOW SIGNER_DIGEST ATTESTATION_SOURCE_DIGEST COMPATIBILITY
          # BEGIN STAGING_RELEASE_INTERNAL_ATTESTATION_VERIFICATION
          case "$REQUIRE_INTERNAL_ATTESTATIONS" in
            true)
              test "$COMPATIBILITY" = pinned-reusable-builder
              case "$SIGNER_WORKFLOW" in
                build-release-candidate-impl.yml)
                  test "$SIGNER_DIGEST" = "$BUILDER_WORKFLOW_COMMIT"
                  test "$ATTESTATION_SOURCE_DIGEST" = "$SOURCE_COMMIT"
                  ;;
                build-historical-staging-baseline-impl.yml)
                  test "$SIGNER_DIGEST" = 22f1e593c36eaf1d70197db91bd54e31844a7eef
                  test "$ATTESTATION_SOURCE_DIGEST" = b883685a513795e6224f4166fef65a72bc120a87
                  ;;
                *)
                  echo "ERROR_INVALID_ATTESTATION_POLICY" >&2
                  exit 1
                  ;;
              esac
              for subject in release.json release-images.json deployment-bundle.json deployment-bundle.tar; do
                gh attestation verify "candidate/$subject" \
                  --repo "$GITHUB_REPOSITORY" \
                  --signer-workflow "TrinyxAI/Trinyx/.github/workflows/$SIGNER_WORKFLOW" \
                  --signer-digest "$SIGNER_DIGEST" \
                  --source-digest "$ATTESTATION_SOURCE_DIGEST" \
                  --deny-self-hosted-runners
              done
              ;;
            false)
              if [[ "$COMPATIBILITY" != frozen-historical-builder ]]; then
                echo "ERROR_INVALID_ATTESTATION_POLICY" >&2
                exit 1
              fi
              test "$SIGNER_WORKFLOW" = build-release-candidate.yml
              test "$SIGNER_DIGEST" = f3a4c1ddcf6a17bfc837071f9046ac4c38a38b47
              ;;
            *)
              echo "ERROR_INVALID_ATTESTATION_POLICY" >&2
              exit 1
              ;;
          esac
          # END STAGING_RELEASE_INTERNAL_ATTESTATION_VERIFICATION
          python3 - <<'PY'
          # BEGIN STAGING_RELEASE_DETERMINISTIC_PROVENANCE
          import datetime as dt
          import json
          import os
          import re
          from pathlib import Path

          UTC_RFC3339 = re.compile(
              r"[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(?:[.][0-9]{1,6})?Z"
          )

          def verified_build_created_at(path):
              value = path.read_text(encoding="utf-8").strip()
              if UTC_RFC3339.fullmatch(value) is None:
                  raise SystemExit("invalid verified build created_at")
              try:
                  parsed = dt.datetime.fromisoformat(value[:-1] + "+00:00")
              except ValueError as exc:
                  raise SystemExit("invalid verified build created_at") from exc
              if parsed.tzinfo != dt.timezone.utc:
                  raise SystemExit("verified build created_at is not UTC")
              return value

          def build_provenance(env, release, verified_at):
              return {
                  "schemaVersion": 2,
                  "repository": "TrinyxAI/Trinyx",
                  "signerWorkflow": env["SIGNER_WORKFLOW"],
                  "signerDigest": env["SIGNER_DIGEST"],
                  "compatibility": env["COMPATIBILITY"],
                  "sourceCommit": release["sourceCommit"],
                  "artifactId": env["ARTIFACT_ID"],
                  "runId": env["RUN_ID"],
                  "artifactDigest": env["ARTIFACT_DIGEST"],
                  "verifiedAt": verified_at,
              }

          def render_provenance(provenance):
              return (
                  json.dumps(provenance, sort_keys=True, separators=(",", ":")) + "\n"
              ).encode("utf-8")

          def main():
              candidate = Path("candidate")
              release = json.loads(
                  (candidate / "release.json").read_text(encoding="utf-8")
              )
              if (
                  release.get("releaseId") != os.environ["RELEASE_ID"]
                  or release.get("sourceCommit") != os.environ["SOURCE_COMMIT"]
                  or release.get("deploymentBundle", {}).get("digest")
                  != os.environ["BUNDLE_DIGEST"]
                  or release.get("deploymentBundle", {}).get("fileCount") != 13
              ):
                  raise SystemExit("release identity changed before provenance generation")
              verified_at = verified_build_created_at(
                  Path("verified-build-created-at.txt")
              )
              provenance = build_provenance(os.environ, release, verified_at)
              (candidate / "provenance.json").write_bytes(
                  render_provenance(provenance)
              )

          if __name__ == "__main__":
              main()
          # END STAGING_RELEASE_DETERMINISTIC_PROVENANCE
          PY
          python3 platform/automation/release_registry.py --help >/dev/null
          PYTHONPATH=platform python3 -c "from pathlib import Path; from automation.release_registry import validate_candidate; validate_candidate(Path('candidate'))"
      - name: Assume publisher-only AWS role
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4, Node 24
        with:
          role-to-assume: ${{ inputs.publisher_role_arn }}
          aws-region: us-east-1
          role-session-name: trinyx-staging-publish-${{ github.run_id }}
      - name: Conditionally register immutable release
        shell: bash
        env:
          REGISTRY_BUCKET: ${{ inputs.registry_bucket }}
          ARTIFACT_ID: ${{ inputs.artifact_id }}
          RUN_ID: ${{ inputs.run_id }}
          ARTIFACT_DIGEST: ${{ inputs.artifact_digest }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          RELEASE_ID: ${{ inputs.release_id }}
          BUNDLE_DIGEST: ${{ inputs.bundle_digest }}
        run: |
          set -euo pipefail
          # BEGIN STAGING_RELEASE_REGISTRY_IDEMPOTENCE
          compatibility="$(
            python3 - <<'PY'
          import json
          from pathlib import Path

          provenance = json.loads(
              Path("candidate/provenance.json").read_text(encoding="utf-8")
          )
          compatibility = provenance.get("compatibility")
          if compatibility not in {
              "frozen-historical-builder",
              "pinned-reusable-builder",
          }:
              raise SystemExit("invalid registration compatibility")
          print(compatibility)
          PY
          )"

          case "$compatibility" in
            pinned-reusable-builder)
              python3 platform/automation/release_registry.py register \
                --bucket "$REGISTRY_BUCKET" \
                --candidate-dir candidate
              ;;
            frozen-historical-builder)
              bundle_hex="${BUNDLE_DIGEST#sha256:}"
              registration_key="staging/releases/$RELEASE_ID/$bundle_hex/registration.json"
              marker_error="$(mktemp)"
              trap 'rm -f "$marker_error"' EXIT
              if aws s3api head-object \
                --bucket "$REGISTRY_BUCKET" \
                --key "$registration_key" \
                --region us-east-1 \
                --output json \
                --no-cli-pager >/dev/null 2>"$marker_error"; then
                test ! -e existing-frozen-registration
                python3 platform/automation/release_registry.py fetch \
                  --bucket "$REGISTRY_BUCKET" \
                  --release-id "$RELEASE_ID" \
                  --bundle-digest "$BUNDLE_DIGEST" \
                  --destination existing-frozen-registration
                PYTHONPATH=platform python3 -c "from pathlib import Path; from automation.release_registry import validate_candidate; validate_candidate(Path('existing-frozen-registration'))"
                python3 - <<'PY'
          # BEGIN STAGING_RELEASE_EXISTING_FROZEN_EQUIVALENCE
          import datetime as dt
          import hashlib
          import hmac
          import json
          import os
          import re
          from pathlib import Path

          FROZEN_ENVIRONMENT = {
              "GITHUB_REPOSITORY": "TrinyxAI/Trinyx",
              "GITHUB_REPOSITORY_ID": "1342032975",
              "GITHUB_REPOSITORY_OWNER_ID": "319253481",
              "RUN_ID": "33485509832",
              "ARTIFACT_ID": "9791964215",
              "ARTIFACT_DIGEST": "sha256:755594078d9da7e19406e01187534132920a31f87804c1b33baa28fa96559152",
              "SOURCE_COMMIT": "f3a4c1ddcf6a17bfc837071f9046ac4c38a38b47",
              "RELEASE_ID": "rel-v1-b5ba70c23b9f529ac8228a7b00b4faa4",
              "BUNDLE_DIGEST": "sha256:c9df14dcd1dbc24b31b926d3778bef2e208b59824c78f24292608284f3579892",
          }
          FROZEN_INTERNAL_SHA256 = {
              "release.json": "ad5a5b702d9659e0af5d5b82a422953ba2390a94396949f897757568c9b59789",
              "release-images.json": "fe1134c3920af0f2f9f0027082f25ec5adb1cbb6d41a1053bada7ef730f66a8a",
              "deployment-bundle.json": "b101918414ee9d113d4ef54d32c9f438005d8ebee7bde2e62f72d58a16cfdd7b",
              "deployment-bundle.tar": "c9df14dcd1dbc24b31b926d3778bef2e208b59824c78f24292608284f3579892",
          }
          PROVENANCE_KEYS = {
              "schemaVersion",
              "repository",
              "signerWorkflow",
              "signerDigest",
              "compatibility",
              "sourceCommit",
              "artifactId",
              "runId",
              "artifactDigest",
              "verifiedAt",
          }
          FROZEN_PROVENANCE = {
              "schemaVersion": 2,
              "repository": "TrinyxAI/Trinyx",
              "signerWorkflow": "build-release-candidate.yml",
              "signerDigest": FROZEN_ENVIRONMENT["SOURCE_COMMIT"],
              "compatibility": "frozen-historical-builder",
              "sourceCommit": FROZEN_ENVIRONMENT["SOURCE_COMMIT"],
              "artifactId": FROZEN_ENVIRONMENT["ARTIFACT_ID"],
              "runId": FROZEN_ENVIRONMENT["RUN_ID"],
              "artifactDigest": FROZEN_ENVIRONMENT["ARTIFACT_DIGEST"],
          }
          UTC_RFC3339 = re.compile(
              r"[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(?:[.][0-9]{1,6})?Z"
          )

          def require(condition, message):
              if not condition:
                  raise SystemExit(message)

          def sha256(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          def require_utc_timestamp(value):
              require(
                  isinstance(value, str) and UTC_RFC3339.fullmatch(value) is not None,
                  "invalid frozen provenance verifiedAt",
              )
              try:
                  parsed = dt.datetime.fromisoformat(value[:-1] + "+00:00")
              except ValueError as exc:
                  raise SystemExit("invalid frozen provenance verifiedAt") from exc
              require(
                  parsed.tzinfo == dt.timezone.utc,
                  "frozen provenance verifiedAt is not UTC",
              )

          def verify_existing_frozen_registration(env, candidate, stored):
              for key, expected in FROZEN_ENVIRONMENT.items():
                  require(
                      env.get(key) == expected,
                      "existing frozen compatibility identity mismatch:" + key,
                  )
              for name, expected_digest in FROZEN_INTERNAL_SHA256.items():
                  local_path = candidate / name
                  stored_path = stored / name
                  require(
                      hmac.compare_digest(sha256(local_path), expected_digest),
                      "local frozen object digest mismatch:" + name,
                  )
                  require(
                      hmac.compare_digest(
                          local_path.read_bytes(), stored_path.read_bytes()
                      ),
                      "stored frozen object differs:" + name,
                  )

              local_provenance = json.loads(
                  (candidate / "provenance.json").read_text(encoding="utf-8")
              )
              stored_provenance = json.loads(
                  (stored / "provenance.json").read_text(encoding="utf-8")
              )
              require(
                  set(local_provenance) == PROVENANCE_KEYS
                  and set(stored_provenance) == PROVENANCE_KEYS,
                  "frozen provenance schema mismatch",
              )
              for key, expected in FROZEN_PROVENANCE.items():
                  require(
                      local_provenance.get(key) == expected
                      and stored_provenance.get(key) == expected,
                      "frozen provenance mismatch:" + key,
                  )
              require_utc_timestamp(local_provenance["verifiedAt"])
              require_utc_timestamp(stored_provenance["verifiedAt"])

          if __name__ == "__main__":
              verify_existing_frozen_registration(
                  os.environ,
                  Path("candidate"),
                  Path("existing-frozen-registration"),
              )
          # END STAGING_RELEASE_EXISTING_FROZEN_EQUIVALENCE
          PY
                echo "RELEASE_REGISTRATION_OK release_id=$RELEASE_ID bundle=$BUNDLE_DIGEST existing_frozen_registration=true"
              else
                marker_status=$?
                if grep -Eq 'An error occurred \((404|NoSuchKey|NotFound)\) when calling the HeadObject operation: (Not Found|NoSuchKey)' "$marker_error"; then
                  python3 platform/automation/release_registry.py register \
                    --bucket "$REGISTRY_BUCKET" \
                    --candidate-dir candidate
                else
                  cat "$marker_error" >&2
                  exit "$marker_status"
                fi
              fi
              ;;
            *)
              echo "ERROR_INVALID_REGISTRATION_COMPATIBILITY" >&2
              exit 1
              ;;
          esac
          # END STAGING_RELEASE_REGISTRY_IDEMPOTENCE
