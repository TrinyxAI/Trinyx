name: Register Staging Release

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: GitHub Actions build workflow run ID
        required: true
        default: '33485509832'
        type: string
      artifact_id:
        description: GitHub Actions artifact ID
        required: true
        default: '9791964215'
        type: string
      artifact_digest:
        description: GitHub artifact ZIP digest
        required: true
        default: 'sha256:755594078d9da7e19406e01187534132920a31f87804c1b33baa28fa96559152'
        type: string
      source_commit:
        description: Frozen application source commit
        required: true
        default: 'f3a4c1ddcf6a17bfc837071f9046ac4c38a38b47'
        type: string
      release_id:
        description: Expected frozen release ID
        required: true
        default: 'rel-v1-b5ba70c23b9f529ac8228a7b00b4faa4'
        type: string
      bundle_digest:
        description: Expected deployment bundle digest
        required: true
        default: 'sha256:c9df14dcd1dbc24b31b926d3778bef2e208b59824c78f24292608284f3579892'
        type: string
      registry_bucket:
        description: Approved ReleaseRegistryBucketName stack output
        required: true
        type: string
      publisher_role_arn:
        description: Approved ReleasePublisherRoleArn stack output
        required: true
        type: string

permissions:
  actions: read
  attestations: write
  contents: read
  id-token: write

concurrency:
  group: trinyx-staging-release-registration
  cancel-in-progress: false

jobs:
  register:
    if: github.ref == 'refs/heads/codex/platform-release-automation'
    environment: staging
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout reviewed platform commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          persist-credentials: false
      - name: Validate immutable identities
        shell: bash
        env:
          ARTIFACT_ID: ${{ inputs.artifact_id }}
          RUN_ID: ${{ inputs.run_id }}
          ARTIFACT_DIGEST: ${{ inputs.artifact_digest }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          RELEASE_ID: ${{ inputs.release_id }}
          BUNDLE_DIGEST: ${{ inputs.bundle_digest }}
          REGISTRY_BUCKET: ${{ inputs.registry_bucket }}
          PUBLISHER_ROLE_ARN: ${{ inputs.publisher_role_arn }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = TrinyxAI/Trinyx
          test "$GITHUB_REPOSITORY_ID" = 1342032975
          test "$GITHUB_REPOSITORY_OWNER_ID" = 319253481
          [[ "$ARTIFACT_ID" =~ ^[0-9]+$ ]]
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE_ID" =~ ^rel-v1-[0-9a-f]{32}$ ]]
          [[ "$BUNDLE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$REGISTRY_BUCKET" =~ ^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$ ]]
          [[ "$PUBLISHER_ROLE_ARN" =~ ^arn:aws:iam::001634075617:role/TrinyxStagingReleasePublisherRole$ ]]
      - name: Download exact existing artifact and verify GitHub ZIP digest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ inputs.artifact_id }}
          RUN_ID: ${{ inputs.run_id }}
          ARTIFACT_DIGEST: ${{ inputs.artifact_digest }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          umask 077
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" > artifact-metadata.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" > run-metadata.json
          python3 - <<'PY'
          import json,os
          artifact=json.load(open('artifact-metadata.json'))
          run=json.load(open('run-metadata.json'))
          assert str(artifact['id'])==os.environ['ARTIFACT_ID']
          assert artifact['name']=='trinyx-release-candidate-'+os.environ['SOURCE_COMMIT']
          assert artifact['expired'] is False
          assert str(artifact['workflow_run']['id'])==os.environ['RUN_ID']
          assert artifact['workflow_run']['head_sha']==os.environ['SOURCE_COMMIT']
          assert run['id']==int(os.environ['RUN_ID']) and run['head_sha']==os.environ['SOURCE_COMMIT']
          assert run['path'].endswith('/build-release-candidate.yml')
          assert run['conclusion']=='success' and run['repository']['full_name']=='TrinyxAI/Trinyx'
          PY
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > candidate.zip
          printf '%s  %s\n' "${ARTIFACT_DIGEST#sha256:}" candidate.zip | sha256sum --check --strict
      - name: Attest the exact downloaded GitHub artifact
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2, Node 24
        with:
          subject-path: candidate.zip
      - name: Verify attestation and release contracts before AWS credentials
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ inputs.artifact_id }}
          RUN_ID: ${{ inputs.run_id }}
          ARTIFACT_DIGEST: ${{ inputs.artifact_digest }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          RELEASE_ID: ${{ inputs.release_id }}
          BUNDLE_DIGEST: ${{ inputs.bundle_digest }}
        run: |
          set -euo pipefail
          gh attestation verify candidate.zip --repo "$GITHUB_REPOSITORY"
          mkdir candidate
          unzip -q candidate.zip -d candidate
          python3 - <<'PY'
          import datetime, json, os
          from pathlib import Path
          candidate=Path('candidate')
          release=json.loads((candidate/'release.json').read_text())
          assert release['releaseId']==os.environ['RELEASE_ID']
          assert release['sourceCommit']==os.environ['SOURCE_COMMIT']
          assert release['deploymentBundle']['digest']==os.environ['BUNDLE_DIGEST']
          assert release['deploymentBundle']['fileCount']==13
          (candidate/'provenance.json').write_text(json.dumps({
            'schemaVersion':1,'repository':'TrinyxAI/Trinyx','workflow':'build-release-candidate.yml',
            'sourceCommit':release['sourceCommit'],'artifactId':os.environ['ARTIFACT_ID'],'runId':os.environ['RUN_ID'],
            'artifactDigest':os.environ['ARTIFACT_DIGEST'],
            'verifiedAt':datetime.datetime.now(datetime.timezone.utc).isoformat().replace('+00:00','Z')
          },sort_keys=True,separators=(',',':'))+'\n')
          PY
          python3 platform/automation/release_registry.py --help >/dev/null
          python3 -c "from pathlib import Path; from platform.automation.release_registry import validate_candidate; validate_candidate(Path('candidate'))"
      - name: Assume publisher-only AWS role
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4, Node 24
        with:
          role-to-assume: ${{ inputs.publisher_role_arn }}
          aws-region: us-east-1
          role-session-name: trinyx-staging-publish-${{ github.run_id }}
      - name: Conditionally register immutable release
        env:
          REGISTRY_BUCKET: ${{ inputs.registry_bucket }}
        run: python3 platform/automation/release_registry.py register --bucket "$REGISTRY_BUCKET" --candidate-dir candidate
