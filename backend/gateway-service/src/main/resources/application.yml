server:
  port: 8086

spring:
  application:
    name: trinyx-gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://keycloak:8080/realms/trinyx/protocol/openid-connect/certs}
  data:
    redis:
      host: ${REDIS_HOST:cloud-redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  cloud:
    gateway:
      server:
        webflux:
          routes:
            # Public/self-authenticating edge surfaces. Keep this list explicit.
            - id: websearch-cdp
              uri: ${WEBSEARCH_SERVICE_URL:http://websearch-service:8085}
              predicates:
                - Path=/cdp/**
            - id: auth-public-release
              uri: ${AUTH_SERVICE_URL:http://auth-service:8083}
              predicates:
                - Path=/api/ce/releases/latest
            - id: auth-stripe-webhook
              uri: ${AUTH_SERVICE_URL:http://auth-service:8083}
              predicates:
                - Path=/webhooks/stripe
            - id: catalog-public-bundles
              uri: ${CATALOG_SERVICE_URL:http://catalog-service:8081}
              predicates:
                - Path=/api/catalog/public/bundles/**

            # Historical public LiveContext edge contract. These routes are anonymous only
            # because their tokens/signatures are the capability; downstream services remain private.
            - id: agent-widget-loader-public
              uri: ${AGENT_SERVICE_URL:http://agent-service:8090}
              predicates:
                - Path=/widget.js
              filters:
                - SetPath=/api/internal/widget/loader.js
            - id: agent-widget-public
              uri: ${AGENT_SERVICE_URL:http://agent-service:8090}
              predicates:
                - Path=/widget/**
              filters:
                - RewritePath=/widget/(?<segment>.*), /api/internal/widget/$\{segment}
            - id: publication-share-public
              uri: ${PUBLICATION_SERVICE_URL:http://publication-service:8092}
              predicates:
                - Path=/share/**
              filters:
                - RewritePath=/share/(?<segment>.*), /api/public/share/$\{segment}
            - id: conversation-share-public
              uri: ${CONVERSATION_SERVICE_URL:http://conversation-service:8087}
              predicates:
                - Path=/c/**
              filters:
                - RewritePath=/c/(?<segment>.*), /api/shared/c/$\{segment}
            - id: agent-webhook-public
              uri: ${AGENT_SERVICE_URL:http://agent-service:8090}
              predicates:
                - Path=/webhook/agent/**
              filters:
                - RewritePath=/webhook/(?<segment>.*), /api/internal/webhook/$\{segment}
            - id: orchestrator-webhook-public
              uri: ${ORCHESTRATOR_SERVICE_URL:http://orchestrator-service:8099}
              predicates:
                - Path=/webhook/**
              filters:
                - RewritePath=/webhook/(?<segment>.*), /api/internal/webhook/$\{segment}
            - id: orchestrator-approval-callback-public
              uri: ${ORCHESTRATOR_SERVICE_URL:http://orchestrator-service:8099}
              predicates:
                - Path=/approval-callback/**
              filters:
                - RewritePath=/approval-callback/(?<segment>.*), /api/internal/approval-callback/$\{segment}
            - id: orchestrator-chat-public
              uri: ${ORCHESTRATOR_SERVICE_URL:http://orchestrator-service:8099}
              predicates:
                - Path=/chat/**
              filters:
                - RewritePath=/chat/(?<segment>.*), /api/internal/chat/$\{segment}
            - id: orchestrator-form-public
              uri: ${ORCHESTRATOR_SERVICE_URL:http://orchestrator-service:8099}
              predicates:
                - Path=/form/**
              filters:
                - RewritePath=/form/(?<segment>.*), /api/internal/form/$\{segment}
            - id: orchestrator-app-public
              uri: ${ORCHESTRATOR_SERVICE_URL:http://orchestrator-service:8099}
              predicates:
                - Path=/app/public/**
              filters:
                - RewritePath=/app/public/(?<segment>.*), /api/internal/app/public/$\{segment}

            # Collision-specific application routes must precede broader families.
            - id: conversation-admin
              uri: ${CONVERSATION_SERVICE_URL:http://conversation-service:8087}
              predicates:
                - Path=/api/admin/conversations/**
            - id: orchestrator-admin
              uri: ${ORCHESTRATOR_SERVICE_URL:http://orchestrator-service:8099}
              predicates:
                - Path=/api/admin/workflows/**
            - id: publication-ce-tls
              uri: ${PUBLICATION_SERVICE_URL:http://publication-service:8092}
              predicates:
                - Path=/api/ce/tls/**
            - id: orchestrator-interface-runtime
              uri: ${ORCHESTRATOR_SERVICE_URL:http://orchestrator-service:8099}
              predicates:
                - Path=/api/interfaces/*/render,/api/interfaces/*/items/**,/api/interfaces/*/run-info,/api/interfaces/*/items-count,/api/interfaces/expression-functions,/api/interfaces/*/render-datasource,/api/interfaces/*/datasource-items-count
            - id: orchestrator-storage-facade
              uri: ${ORCHESTRATOR_SERVICE_URL:http://orchestrator-service:8099}
              predicates:
                - Path=/api/files/download,/api/storage/explorer/**,/api/storage/quota/**
            - id: orchestrator-workflows-v2
              uri: ${ORCHESTRATOR_SERVICE_URL:http://orchestrator-service:8099}
              predicates:
                - Path=/api/v2/workflows/**

            # Normal authenticated LiveContext/Trinyx application APIs.
            - id: auth-application
              uri: ${AUTH_SERVICE_URL:http://auth-service:8083}
              predicates:
                - Path=/.well-known/jwks.json,/v1/authorize/**,/api/admin/**,/api/auth/**,/api/billing/**,/api/bridge-access/**,/api/ce-link/**,/api/ce/**,/api/cloud-authority/**,/api/contact/**,/api/credentials/**,/api/credits/**,/api/me/**,/api/onboarding/**,/api/organizations/**,/api/platform-credentials/**,/api/subscriptions/**,/api/users/**,/api/variables/**,/api/version/**
            - id: publication-application
              uri: ${PUBLICATION_SERVICE_URL:http://publication-service:8092}
              predicates:
                - Path=/api/application-folders/**,/api/ce-marketplace/**,/api/cloud-link/**,/api/public/**,/api/publications/**
            - id: conversation-application
              uri: ${CONVERSATION_SERVICE_URL:http://conversation-service:8087}
              predicates:
                - Path=/api/conversations/**,/api/dm/**,/api/shared/**,/api/tool-results/**,/api/v3/chat/**
            - id: agent-application
              uri: ${AGENT_SERVICE_URL:http://agent-service:8090}
              predicates:
                - Path=/api/agent-folders/**,/api/agent-prompts/**,/api/agent/**,/api/agents/**,/api/catalog-bundles/**,/api/ce-llm/**,/api/llm-providers/**,/api/model-config/**,/api/recurrences/**,/api/skill-bundles/**,/api/skill-folders/**,/api/skills/**,/api/tasks/**
            - id: catalog-application
              uri: ${CATALOG_SERVICE_URL:http://catalog-service:8081}
              predicates:
                - Path=/api/apis/**,/api/capability_knn/**,/api/catalog/**,/api/ce-catalog/**,/api/generation/**,/api/tool-categories/**,/api/tool-responses/**,/api/tools/**,/api/v1/**,/api/workflow-inspector/**,/catalog/v1/**
            - id: datasource-application
              uri: ${DATASOURCE_SERVICE_URL:http://datasource-service:8088}
              predicates:
                - Path=/api/crud/**,/api/data-sources/**,/api/table-folders/**
            - id: orchestrator-application
              uri: ${ORCHESTRATOR_SERVICE_URL:http://orchestrator-service:8099}
              predicates:
                - Path=/api/activities/**,/api/agent-tools/**,/api/workflow-folders/**,/api/browser-agent/**,/api/categories/**,/api/ce-websearch/**,/api/dashboard/**,/api/favorites/**,/api/mcp-server/**,/api/mcp/**,/api/node-definitions/**,/api/node-type-settings/**,/api/notifications/**,/api/org-access/**,/api/projects/**,/api/schedules/**,/api/stats/**,/api/websearch/**,/api/workflow-builder/**,/api/workflows/**,/mcp/**,/v1/chat/**
            - id: interface-application
              uri: ${INTERFACE_SERVICE_URL:http://interface-service:8089}
              predicates:
                - Path=/api/interface-folders/**,/api/interfaces/**
            - id: storage-application
              uri: ${STORAGE_SERVICE_URL:http://storage-service:8082}
              predicates:
                - Path=/api/files/**,/api/storage/**,/storage/v1/**
            - id: trigger-application
              uri: ${TRIGGER_SERVICE_URL:http://trigger-service:8091}
              predicates:
                - Path=/api/chat-endpoints/**,/api/form-endpoints/**,/api/webhooks/**
            - id: conversation-websocket
              uri: ${CONVERSATION_WS_URL:ws://conversation-service:8087}
              predicates:
                - Path=/ws/**

trinyx:
  gateway:
    jwt:
      issuer: ${KEYCLOAK_ISSUER:https://auth.trinyx.fr/realms/trinyx}
      audience: ${KEYCLOAK_AUDIENCE:trinyx-frontend}
    auth-service-url: ${AUTH_SERVICE_URL:http://auth-service:8083}
    hmac-secret: ${GATEWAY_SECRET_KEY:}
    max-body-bytes: ${CLOUD_GATEWAY_MAX_BODY_BYTES:52428800}
    max-buffered-requests: ${CLOUD_GATEWAY_MAX_BUFFERED_REQUESTS:8}
    rate-limit:
      requests-per-window: ${CLOUD_GATEWAY_RATE_LIMIT_REQUESTS:120}
      window-ms: ${CLOUD_GATEWAY_RATE_LIMIT_WINDOW_MS:60000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
